repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Same exclusions as .github/workflows/secrets.yml: SOPS ciphertext and the registry's
        # keyed expected_hmac digests are not secrets and change on every sops-edit.
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - '.*\.sops\.(env|ya?ml|json)$'
          - --exclude-lines
          - '^\s*expected_hmac:\s*"[0-9a-f]{64}"\s*$'

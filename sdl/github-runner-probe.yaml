---
# Qualify a provider as a RUNNER HOST — a different question from "is it healthy".
#
# A provider can be online, have huge free capacity, bid, WIN — and never schedule the
# runner pod. Recorded for three providers at BOTH 16Gi/30Gi and 32Gi/30Gi, so it is not
# a memory-size problem; ephemeral storage and the port-80 global ingress below are the
# live hypotheses. That failure is WORSE than no bid: the lease consumes the attempt,
# holds escrow, and stalls to the timeout. One instance was traced to an 1800s stall.
#
# So this SDL exists to reproduce that failure deliberately, on ONE provider at a time,
# at the caller's real profile — because a provider qualified at 30Gi is NOT thereby
# qualified at 100Gi, and storage is the tightest constraint on eligibility.
#
# ⚠️ THE SERVICE IS NAMED `probe` ON PURPOSE, AND RENAMING IT LEAKS ESCROW.
# cleanup_stale classifies by SERVICE SET, not by tag (just_akash/cleanup_stale.py:63):
#     services == {probe}     -> STALE after 1h  -> reaped
#     services == {backtest}  -> STALE after 48h -> reaped
#     anything else           -> LEAVE (unclassifiable)
# A distinctive name like `runner-probe` would fall into that last branch and accumulate
# FOREVER, holding escrow against the same grant the CI pool spends from — i.e. this
# qualification tool would degrade the thing it exists to fix. Reusing `probe` inherits
# the proven reaper instead of adding a parallel one. The 1h threshold cannot kill an
# in-flight probe: a pass completes in minutes, and a hang is exactly what we want reaped.
#
# NO REAL GITHUB TOKEN IS REQUIRED to answer the primary question. With a placeholder the
# container still has to be SCHEDULED and started, which is the discriminator — it simply
# fails to register afterwards. Supply a real ACCESS_TOKEN only for the stronger check
# (registers, runs a no-op job), which the quorum requires before promoting a provider to
# runner_host.
#
# Placeholders substituted by the probe: {{CPU}} {{MEMORY}} {{STORAGE}} {{ACCESS_TOKEN}}
# {{ORG_NAME}} {{RUNNER_NAME_PREFIX}} {{LABELS}}

version: "2.0"

services:
  probe:
    image: ghcr.io/akash-network/github-runner:latest
    env:
      - ACCESS_TOKEN={{ACCESS_TOKEN}}
      - ORG_NAME={{ORG_NAME}}
      - RUNNER_SCOPE=org
      - RUNNER_NAME_PREFIX={{RUNNER_NAME_PREFIX}}
      - LABELS={{LABELS}}
      # EPHEMERAL=true so a probe that DOES register removes itself after one job
      # rather than lingering as an offline registration. Offline registrations
      # overflowed the org's runner-listing first page once and broke provisioning
      # for every repo, so a qualification run must not contribute to that.
      - EPHEMERAL=true
      - DISABLE_AUTO_UPDATE=true
      - RUNNER_WORKDIR=/_work
      - RUN_AS_ROOT=true
    expose:
      # Port 80 global is part of what is being tested, not incidental: it is one of
      # the two live hypotheses for the lease-but-never-schedule failures. Removing it
      # would make the probe pass on providers the real runner cannot use.
      - port: 80
        as: 80
        to:
          - global: true

profiles:
  compute:
    probe:
      resources:
        cpu:
          units: {{CPU}}
        memory:
          size: {{MEMORY}}
        storage:
          size: {{STORAGE}}

  placement:
    probe:
      pricing:
        probe:
          denom: uact
          amount: 100000

deployment:
  probe:
    probe:
      profile: probe
      count: 1

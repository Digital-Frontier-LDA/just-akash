# secrets/registry.yaml -- just-akash's SECRET REGISTRY.
#
# A PLAINTEXT INVENTORY of names, never values. Values live only in the SOPS files named under
# each entry's `consumers`. Treat any value committed here as an incident.
#
# WHY IT EXISTS (Flynn openmix-h2l7, 2026-10-17): df-cicd's mint-once fan-out
# (.github/workflows/sops-mint-fanout.yml) writes ONE self-generated value into several repos'
# vaults through sops-edit with a STRICT registry digest, and refuses a target with no registry.
# The first such secret here is JUST_AKASH_LEASE_INTENT_CLIENT_SECRET, shared with
# Akash-Console's vault (Keycloak machine client just-akash-lease-intent, Akash-Console#1147).
#
# ENTRIES ARE WRITTEN BY sops-edit, not by hand: `add` creates the entry, its `purpose` and its
# keyed digest `expected_hmac` = HMAC-SHA256(REGISTRY_HMAC_KEY, value), with the key from
# secrets/registry-hmac.sops.env (df-cicd infra/scripts/sops-digest.py, secrets-verify parity).
# Secrets already in secrets/ci.sops.env are not listed yet; an absent entry is unmanaged, not
# drift.

version: 1
repo: just-akash
secrets:
  JUST_AKASH_LEASE_INTENT_CLIENT_SECRET:
    purpose: "Flynn lease-intent machine client just-akash-lease-intent (Akash-Console #1147, Flynn openmix-h2l7): just-akash CI records why its leases exist via Flynn POST /api/v1/lease-intents. Minted once by sops-mint-fanout.yml; Akash-Console (Keycloak) and just-akash (CI) hold the same value."
    type: self-generated
    rotation: regenerate
    consumers: [{ file: secrets/ci.sops.env, key: JUST_AKASH_LEASE_INTENT_CLIENT_SECRET }]
    shared_with: [Akash-Console]
    provider_invalidation: immediate
    reissue: "df-cicd sops-mint-fanout.yml profile=custom, verb rotate, one mint written to BOTH vaults (Akash-Console infra/ansible/vault.sops.yaml just_akash_lease_intent_client_secret + just-akash secrets/ci.sops.env JUST_AKASH_LEASE_INTENT_CLIENT_SECRET; sops-apply approval); merge the PR pair TOGETHER; then the console_db tron-access (keycloak-config) apply so the just-akash-lease-intent client takes the new secret. just-akash CI reads it from its own vault on its next run, so the only window where the two disagree is between the merge and the apply"
    rollback: "reverting the PR pair does NOT revoke a live secret (tron-access.yml defaults a missing value to empty and apply-tron-access.sh then leaves the live secret unchanged). To restore a working credential, rotate again through sops-mint-fanout.yml (both vaults, one mint) and re-run the console_db tron-access apply. To revoke, remove just-akash-lease-intent from Flynn FLYNN_LEASE_INTENT_CLIENTS (IaC) and redeploy, so Flynn refuses its tokens; deleting or disabling the Keycloak client is an operator action, since apply-tron-access.sh never deletes a client or revokes"
    expected_hmac: "26727e12ea37e9f618c8f7181cf602885281ab7202ac3557bf361baa981bea5b"
    last_rotated: "2026-10-17"
    owner: jobordu
  REGISTRY_HMAC_KEY:
    purpose: "Keyed digest for just-akash's secrets/registry.yaml (sops-edit strict digest; df-cicd sops-mint-fanout)"
    type: self-generated
    rotation: regenerate
    consumers: [{ file: secrets/registry-hmac.sops.env, key: REGISTRY_HMAC_KEY }]
    shared_with: []
    provider_invalidation: none
    reissue: "Bootstrap key: it keys every expected_hmac in this file, and df-cicd secrets-verify.sh exempts it by name. 1) df-cicd sops-edit.yml verb=rotate mint=hex-32 on secrets/registry-hmac.sops.env REGISTRY_HMAC_KEY (sops-apply approval); it opens a PR. 2) On that PR branch, re-attest every other entry here (sops-edit.yml verb=attest, ref = the rotate PR branch), so each expected_hmac is recomputed under the new key in the same PR. 3) secrets-verify must pass digest parity on the PR before merge; until step 2 is complete, parity fails for every entry keyed by the old value (df-cicd infra/doc/SECRET-ROTATION.md, Bootstrap rotation)."
    rollback: "Revert the rotate PR together with the attests merged with it (one PR by construction, step 2 above): reverting the key alone leaves every expected_hmac keyed by the new value and digest parity fails. Reverting does NOT revoke anything: this key only keys registry digests and gates no access, so a value that leaked must be rotated (reissue above), never reverted to."
    expected_hmac: "02f360864bd866356a7dbc4ad36d763f67f5130a60323bd81cb33ff7bf3f2bb0"
    last_rotated: "2026-10-17"
    owner: jobordu

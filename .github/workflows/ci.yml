name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Pyright type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --dev

      - name: Cache pyright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pyright
          key: pyright-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            pyright-${{ runner.os }}-

      - name: Pyright type check
        run: uv run pyright

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/ --tb=short -q

  # DEPENDABOT CANNOT REACH SOPS, so these two jobs could never pass on its PRs.
  # GitHub withholds repository secrets from dependabot by design -- a malicious
  # dependency update must not be able to exfiltrate them -- so SOPS_AGE_KEY arrives
  # empty and the sops-env action fails: "SOPS_AGE_KEY is empty -- cannot decrypt
  # secrets/ci.sops.env". Measured 2026-08-10: PRs #136/#137/#138 all sat at
  # fail=2 pass=11, identical and permanent.
  #
  # That breaks the rule this org already wrote down -- df-wiki
  # content/platform/alerting-standard.md section 1, "A check must be able to fail --
  # and to pass" (it is NOT a file in this repo). A check that can never go green
  # does not add safety; it trains everyone to merge red, which is how a real failure
  # eventually walks through. Dependency bumps include SECURITY patches, so the cost
  # lands exactly where it hurts.
  #
  # Skipped rather than made to pass, and the skip is REPORTED (see
  # dependabot-coverage-note below). A silent skip would be the defect this repo has
  # spent the week removing.
  e2e-shell:
    name: E2E lease-shell transport
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --dev

      - name: Install just
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: just

      # AKASH_API_KEY / AKASH_PROVIDERS / SSH_PUBKEY come from secrets/ci.sops.env
      # (SOPS+age); SOPS_AGE_KEY is the only GitHub secret this needs.
      - name: Load SOPS secrets
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Run E2E lease-shell test
        run: uv run python -m just_akash.test_shell_e2e

  e2e-secrets:
    name: E2E secrets injection
    runs-on: ubuntu-latest
    # Run after e2e-shell, never alongside it: both jobs deploy with the same
    # AKASH_API_KEY (one Akash account). Concurrent runs collide on the same
    # deployment and the stale-deployment recovery in deploy.py tears down the
    # other job's live deployment — surfacing as "manifest version validation
    # failed" (422) and "lease not active". Serializing keeps each job isolated.
    needs: e2e-shell
    if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --dev

      - name: Install just
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: just

      # AKASH_API_KEY / AKASH_PROVIDERS come from secrets/ci.sops.env (SOPS+age).
      - name: Load SOPS secrets
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      # Runs AFTER the SOPS load on purpose: this job needs a throwaway keypair it
      # holds the private half of, so the generated SSH_PUBKEY must override the
      # one from the encrypted file (later $GITHUB_ENV write wins).
      - name: Generate SSH keypair
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "akash-e2e"
          echo "SSH_KEY_PATH=~/.ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_PUBKEY=$(cat ~/.ssh/id_ed25519.pub)" >> "$GITHUB_ENV"

      - name: Run E2E secrets test
        run: uv run python -m just_akash.test_secrets_e2e

  # The predicate is the PR AUTHOR, not github.actor. github.actor is whoever triggered
  # THIS RUN, so a human clicking "Re-run all jobs" on a red dependabot PR would flip the
  # guard: the E2E jobs would run again, still without secrets, fail again -- and the
  # note below would NOT run, so the tick would go back to being permanently red AND
  # silent. Re-running a red check is the most likely human action here, so the guard has
  # to survive it. github.event.pull_request.user.login stays dependabot[bot] across
  # re-runs. Raised by Copilot on #140.
  #
  # KNOWN GAP, pre-existing and deliberately not widened here: a FORK pull request is
  # excluded by the same-repo guard and gets no note either, so its green tick is
  # narrower in exactly the same way. It is left alone because fork PRs are governed by
  # a separate policy decision (whether to run secret-bearing jobs on untrusted code at
  # all) and this change is about a check that cannot pass, not about that.
  #
  # The skip above must not read as coverage. This job runs ONLY for dependabot and
  # states plainly what was not exercised, so the green tick on such a PR is honest
  # about its own scope rather than silently narrower than every other PR's.
  dependabot-coverage-note:
    name: E2E coverage not exercised (dependabot)
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions: {}
    steps:
      - name: Say what did not run
        run: |
          set -euo pipefail
          echo "::notice::E2E lease-shell transport and E2E secrets injection were SKIPPED: dependabot PRs cannot read repository secrets, so SOPS_AGE_KEY is empty and secrets/ci.sops.env cannot be decrypted. Lint, typecheck and unit tests DID run."
          {
            echo "### E2E coverage not exercised on this PR"
            echo ""
            echo "\`E2E lease-shell transport\` and \`E2E secrets injection\` were **skipped**."
            echo ""
            echo "GitHub withholds repository secrets from dependabot, so \`SOPS_AGE_KEY\`"
            echo "is empty and \`secrets/ci.sops.env\` cannot be decrypted. These jobs could"
            echo "not pass here regardless of the change."
            echo ""
            echo "**Ran:** lint, typecheck, unit tests."
            echo "**Did not run:** both E2E suites, which are the only jobs that deploy a real lease."
            echo ""
            echo "Judge this PR on the diff and the unit suite; a green tick here is narrower than on a normal PR."
          } >> "$GITHUB_STEP_SUMMARY"

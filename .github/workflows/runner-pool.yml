# Provision a pool of ephemeral GitHub Actions runners on Akash.
#
# Callers use it as:
#
#   jobs:
#     pool:
#       uses: Digital-Frontier-LDA/just-akash/.github/workflows/runner-pool.yml@runner-v1
#       with:
#         runner-label: fast-pool-${{ github.run_id }}
#         tag-prefix:   ci-myrepo          # REQUIRED, must name YOUR repo — see below
#         github-org:   my-org
#         runner-group-id: '1234'          # restricted to this repo + workflow
#         create-operation: ${{ needs.admit.outputs.operation_ordinal }} # broker-issued
#         runner-slots: '["unit-1","unit-2"]'
#         runner-image: >-
#           ghcr.io/digital-frontier-lda/df-akash-runner@sha256:5b43d797d92bb081d2e085046b48579ebf0448a48fcc32f562eafa0c811b4a32
#       secrets:
#         AKASH_API_KEY:  ${{ secrets.AKASH_API_KEY }}
#         AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}   # optional wallet pool
#         GH_RUNNER_PAT:  ${{ secrets.GH_RUNNER_PAT }}
#     work:
#       needs: pool
#       runs-on: ${{ fromJSON(needs.pool.outputs.runner-targets).unit-1 }}
#
# Successful provisioning hands a live pool to the caller. The caller MUST run its
# runner-teardown job with always(), needing the pool and every consumer job; it must
# also adopt the independent scheduled cleanup backstop. Internal cleanup below is
# rollback for failed/cancelled provisioning, not cleanup after successful handoff.
#
# `runner-targets` maps each declared slot to an exact label set. A caller routes one
# job to one slot; the workflow publishes no target unless the complete declared
# population is online in the verified runner group with its exact IDs, names and labels.
#
# ── WHY IT REPORTS SO MUCH ──────────────────────────────────────────────────────
# The predecessor printed "(infra)" for every failure. A funding problem, a market
# outage and a provider that cannot host a runner were indistinguishable, so the
# standing fix became "move more jobs to hosted runners" — which is the thing that
# grows the bill. Every failure here names which world it came from.
#
# ── TAG-PREFIX IS REQUIRED AND HAS NO DEFAULT ───────────────────────────────────
# A shared default once caused a sibling repo's cleanup to destroy a live deployment,
# because both used the same `ci-<id>` shape. Put your repo name in it.
#
# ⛔ CORRECTED. This said "Deployments are tagged `<tag-prefix>-<run_id>` SO A SWEEPER CAN
# REAP THIS RUN'S LEASE and nothing else." That is not what happens. `just-akash tag`
# writes `.tags.json` inside the INSTALLED PACKAGE DIRECTORY (`just_akash/api.py:31`),
# and every CI job installs the CLI freshly via `uvx`, so the file is destroyed before any
# later job or any sweeper reads it. The run id never leaves the runner and never reaches
# the chain.
#
# ⚠ THE PROSE WAS LOAD-BEARING AND WRONG, WHICH IS WORSE THAN ABSENT. A consumer built an
# hourly sweeper selecting on that tag. It reported:
#
#     [sweeper] 47 active deployments
#     [sweeper] 0 carry a ci-<run_id> tag
#               (47 with other tags, 0 untagged). Filter is working as designed; nothing to sweep.
#
# It had never reclaimed a lease. Both readings were artefacts of `""` vs `null`, and the
# alarm branch was unreachable, so the reassuring branch ran every hour.
#
# ⇒ WHAT ACTUALLY CARRIES THE RUN ID IS `placement-key`, stamped below. It is
# author-controlled, written ATOMICALLY inside MsgCreateDeployment, immutable afterwards,
# and readable from the chain with ZERO auth — which is what a sweeper in another repo,
# holding no key for this wallet, actually has. See #311.
#
# `tag-prefix` remains required because it still namespaces the local tag file and callers
# pass it today; it is simply not the reaping key.
name: Akash runner pool

on:
  workflow_call:
    inputs:
      runner-label:
        description: 'Unique label for this pool; carries run identity into runs-on.'
        required: true
        type: string
      tag-prefix:
        description: >-
          REQUIRED, no default. Deployments are tagged `<tag-prefix>-<run_id>` and a
          sweeper may only reap tags matching its own prefix. MUST include your repo
          name: a shared default once let one repo's cleanup destroy another's live
          deployment.
        required: true
        type: string
      placement-key:
        description: >-
          The on-chain `group_spec.name` this pool's deployments carry — the provenance
          marker a reaper matches on. Defaults to `just-akash-runner`, so a caller that
          does not set it is byte-identical to before.

          ⛔ SET THIS IF YOU ADOPT `reusable-akash-escrow-reaper.yml`. That workflow
          requires a `placement-prefix` with no default, deliberately, because a prefix
          matching nothing gives an INERT reaper — one that reports 0 forever over an
          unswept account. The default below is shared by every consumer of this
          workflow on a shared Console wallet, so a consumer adopting the reaper with
          `placement-prefix: just-akash-` would claim EVERY other consumer's pools and
          this repo's own provider canary. Namespace it to your repo instead.

          ⚠ THE DEFAULT IS ALSO WHAT PROTECTS AN UNCHANGED CALLER. `just-akash-runner`
          is what the sibling repo's sweeper spares; see just_akash/provenance.py, which
          records why the placement KEY carries this and not an attribute. A caller that
          changes it and does not adopt a reaper aimed at the new value has unstamped its
          pools relative to every existing filter — change it and adopt in one change.
        required: false
        default: just-akash-runner
        type: string
      just-akash-ref:
        description: >-
          REQUIRED, no default. The just-akash revision this pool provisions FROM.
          Pass the same ref you pinned this workflow to
          (`uses: Digital-Frontier-LDA/just-akash/.github/workflows/runner-pool.yml@<ref>`).

          NO DEFAULT ON PURPOSE. A default here means "whatever main happens to be at
          deploy-second", which is an unpinned supply-chain window that looks pinned
          from the caller's side: the caller pinned the WORKFLOW, and the binary it
          provisions would come from somewhere else. The previous code derived this
          from `job.workflow_sha`, which is not a real context property and resolved
          to the empty string, so checkout silently took the default branch (#184).
        required: true
        type: string
      just-akash-repository:
        description: >-
          Repository to provision the just-akash CLI from. Defaults to this repo;
          override it so a fork's callers get the FORK's CLI rather than ours.
        required: false
        default: 'Digital-Frontier-LDA/just-akash'
        type: string
      github-org:
        description: 'GitHub org the runners register into.'
        required: true
        type: string
      providers:
        description: >-
          Provider candidates as a JSON array carrying the markers that decide whether
          a provider can host a RUNNER — a different question from whether it is healthy
          or cheap:

            [{"address":"akash1…","runner_host":true,"failover_priority":20},
             {"address":"akash1…","runner_deny":true}]

          preferred    Operator-owned/preferred provider auction tier.
          runner_host  PROVEN to bring the runner online. Legacy specs without
                       `preferred` treat this as preferred; explicit false keeps
                       a qualified third-party host in fallback.
          runner_deny  leases but NEVER schedules the runner pod — never tried.
          ci_only      third-party; fine for a throwaway runner, not customers.

          A flat comma-separated list is accepted; every entry is then UNMARKED
          (unproven, but not denied). Empty falls back to just-akash's own defaults.

          No default on purpose: the markers only mean anything against a specific
          fleet's measurements, and a shared list would make one operator's trust
          decision everyone's. Qualify your own with `just-akash runner-probe`.
        required: false
        type: string
        default: ''
      runner-group-id:
        description: >-
          REQUIRED GitHub organization runner-group ID. JIT configuration creation binds
          every slot to this group; a default would silently widen which repositories may
          route work to the runner.
        required: true
        type: string
      create-operation:
        description: >-
          REQUIRED canonical positive operation ordinal allocated by the external
          lifecycle broker under its owner-wide CAS. This workflow validates and carries
          the broker value unchanged; it never derives authority from run_id. Until that
          broker is wired, this phase-two workflow is non-promotable.
        required: true
        type: string
      runner-slots:
        description: >-
          REQUIRED JSON array of unique slot names, for example ["unit-1","unit-2"].
          Each slot receives its own runner identity, JIT configuration, count:1 Akash
          service, label, and exact runs-on target.
        required: true
        type: string
      runner-image:
        description: >-
          REQUIRED sha256-pinned df-akash-runner image implementing RUNNER_JIT_CONFIG.
          There is no compatibility default: the legacy image accepts a reusable PAT and
          cannot consume this workflow's one-runner configuration.
        required: true
        type: string
      cpu:
        required: false
        type: string
        default: '4'
      memory:
        required: false
        type: string
        default: '16Gi'
      storage:
        description: >-
          Ephemeral storage per replica. NOT free: storage is the tightest constraint on
          which providers can host the runner at all, and lease-but-never-schedule
          failures were recorded at 30Gi — a larger ask only narrows the eligible set.
          Whatever you pass is the profile your providers must be qualified against.
        required: false
        type: string
        default: '30Gi'
      required-deposit-usd:
        # ⛔ THIS IS THE ESCROW DEPOSIT, AND IT IS THE POOL'S HARD LIFETIME. It is passed
        # straight to `just-akash deploy --deposit` (below) and NOWHERE ELSE — there is no
        # balance precondition in this workflow. The old description said "free credit needed
        # before attempting a deploy", which named a check that does not exist here, so a
        # caller reading it would believe lowering this weakens a safety gate. It does not:
        # it shortens how long a LEAKED pool keeps billing.
        #
        # ⇒ WHY THAT MATTERS. Akash closes a deployment when its escrow is exhausted, so the
        # deposit is a self-terminating TTL that needs no reaper, no event, no credential and
        # no correct code — the only leak bound that holds when every other layer fails. It is
        # also the only one nobody had chosen: this default was inherited, not sized.
        #
        # MEASURED on chain 2026-09-08, blazing's runner pools (zero auth, anyone can repeat
        # it): funds 1,988,192 uact against a lease rate of 69 uact/block = 28,814 blocks
        # ~= 48.0h, identical across every active stamped pool. The longest CI run this
        # provisions for is ~2h. So an undetected leak bills for 24x the job it served.
        #
        # ⇒ The chain's own floor is `min_deposits` = 500,000 uact (akash/deployment params),
        # which is ~12.1h at that rate. So the bound is tunable between ~12h and whatever you
        # fund, and 48h is not a decision anyone made.
        #
        # ⚠ WHY THIS IS NOT SIMPLY LOWERED HERE. The input is denominated in USD and the
        # deposit lands in uact, so the TTL a given number buys FLOATS with price. A value
        # chosen close to the chain floor becomes a REJECTED DEPLOY when the price moves, and
        # this input gates every CI pool in every consuming repo. Tightening it is a real
        # improvement to a last-resort bound traded against live-CI breakage, which is a
        # decision for whoever owns that trade — not a tidy-up. Denominating it in uact would
        # remove the coupling and is the better fix.
        description: >-
          Escrow deposit for the pool, in USD, passed to `just-akash deploy --deposit`.
          ⛔ NOT a credit precondition — this is the pool's self-terminating lifetime:
          escrow exhaustion closes the deployment, so this is the hard bound on how long a
          LEAKED pool bills. Measured 2026-09-08: the '5' default buys ~48h against a ~2h
          job. The chain floor is 500,000 uact (~12h at the same rate).
        required: false
        type: string
        default: '5'
      provider-select:
        description: >-
          OPTIONAL. Bid selection policy among equally-eligible providers, passed to
          `just-akash deploy --select`. EMPTY (the default) means the CLI's default,
          `cheapest`. `emptiest` prefers the bidder with the most free capacity (one
          /status probe per bidder; a bidder whose status is unreadable degrades to
          cheapest). Measured 2026-08-27: both readable vetted providers sit ~93% full,
          so on a contended market `emptiest` raises the per-attempt bid rate. Shipped
          in the CLI by #211; unreachable from any consumer until this input.
        required: false
        type: string
        default: ''
      expected-runner-version:
        description: >-
          OPTIONAL. When set, the landing gate also discards a lease whose online runners
          report a version other than this one.

          ⚠ EMPTY BY DEFAULT, AND THAT IS THE POINT. The gate's standing behaviour is to
          reject a runner reporting NO version — one that registered, took the mandated
          auto-update, and died. Pinning a version number here turns this into a static
          floor that passes today and rots at the next release, which is the exact defect
          the auto-update mandate exists to avoid. Set it only for a deliberate,
          time-boxed pin, and remove it again.
        required: false
        type: string
        default: ''
      runner-wait-tries:
        description: >-
          How many 5-second polls to wait for the pool to come online. 90 (7.5 min) is
          tuned for a handful of replicas and is NOT free to raise: GitHub cannot filter
          runners by label, so every poll pages the WHOLE org listing —
          ceil(org_runners/100) requests each — against a PAT's 5,000/hour shared across
          all of that user's tokens and repos.

          Raise it when a large pool legitimately needs longer to register (N replicas
          pull the runner image before any of them report in), and know that you are
          spending request budget every other pool draws from. Lower it to fail fast.
        required: false
        type: string
        default: '90'
    secrets:
      AKASH_API_KEY:
        required: false
        description: >-
          Single-key compatibility credential. At least one of AKASH_API_KEY or
          AKASH_API_KEYS must be supplied.
      AKASH_API_KEYS:
        required: false
        description: >-
          OPTIONAL wallet pool: several Console API keys, one per line. Each key is a
          separate Cosmos account. just-akash measures authoritative free uact and creates
          from the richest account that meets the deposit floor. Teardown searches the
          pool for the account that owns the DSEQ, so key order and balance changes cannot
          redirect a close. Empty or unset preserves single-key behaviour.
      GH_RUNNER_PAT:
        required: true
        description: 'Registers runners into the org and polls their status.'
    outputs:
      dseq:
        description: 'Deployment sequence number; empty when no lease survived.'
        value: ${{ jobs.pool.outputs.dseq }}
      provision_healthy:
        description: "'true' iff a usable pool came online. Key your fallback on this."
        value: ${{ jobs.pool.outputs.provision_healthy }}
      runners_online:
        description: 'Distinct online runners as "K/N".'
        value: ${{ jobs.pool.outputs.runners_online }}
      runner-targets:
        description: >-
          JSON object keyed by slot. Each value is that slot's exact runs-on label array;
          consume one key with fromJSON(needs.pool.outputs.runner-targets).<slot>.
        value: ${{ jobs.pool.outputs.runner-targets }}
      runner-labels:
        description: 'JSON object mapping each declared slot to its unique runner label.'
        value: ${{ jobs.pool.outputs.runner-labels }}
      runner-ids:
        description: 'JSON list of exact GitHub runner IDs created for the accepted attempt.'
        value: ${{ jobs.pool.outputs.runner-ids }}
      runner-names:
        description: 'JSON list of exact GitHub runner names created for the accepted attempt.'
        value: ${{ jobs.pool.outputs.runner-names }}
      operation-label:
        description: 'The exact idv2 operation-scoped GitHub registration label.'
        value: ${{ jobs.pool.outputs.operation-label }}
      failure_reason:
        description: >-
          WHY a fallback happened, when it did. One of RUNNER_PAT_MISSING,
          RUNNER_PAT_INVALID, WALLET_UNDERFUNDED, WALLET_TX_CONTENTION,
          NO_ELIGIBLE_BIDDER, PROVIDER_CAPACITY, RUNNER_NEVER_REGISTERED,
          GITHUB_API_UNAVAILABLE, CREATE_RECEIPT_UNREADABLE, CREATE_RECEIPT_CONFLICT,
          CREATE_SETTLEMENT_UNOBSERVED, CREATE_WITHOUT_PROVIDER, INDETERMINATE — or
          empty on success. Each implies a
          different remedy, which is why they are not collapsed into "infra".

          Three of them are explicitly NOT statements about a provider, and each was
          measured misreporting as one:

          RUNNER_PAT_INVALID     our credential expired
          GITHUB_API_UNAVAILABLE the runner listing was never readable, so the pool
                                 was never observable — folding this into
                                 RUNNER_NEVER_REGISTERED would runner_deny providers
                                 for our own rate limit
          WALLET_TX_CONTENTION   concurrent provisioners on one Cosmos account reject
                                 each other; no order is created, so the market never
                                 saw the request and PROVIDER_CAPACITY is fiction
        value: ${{ jobs.pool.outputs.failure_reason }}
      wallet_free_usd:
        description: 'Free credit after escrow at provision time.'
        value: ${{ jobs.pool.outputs.wallet_free_usd }}
      wallet_index:
        description: >-
          Deprecated compatibility output. Native wallet selection is balance-ranked,
          not positional; consumers must use wallet_address when they need identity.
        value: ${{ jobs.pool.outputs.wallet_index }}
      wallet_address:
        description: >-
          The Akash account that actually provisioned this pool. Teardown locates the
          DSEQ owner across the supplied pool instead of re-deriving a positional choice.
        value: ${{ jobs.pool.outputs.wallet_address }}
      deployment_group:
        description: >-
          The final submitted group_spec.name after runner-pool applies its run stamp.
          Published independently of provisioning success for bound rollback and teardown.
        value: ${{ jobs.pool.outputs.deployment_group }}
      runner_hosts_proven:
        description: >-
          Supplied providers marked runner_host and not runner_deny. Below 3, one silent
          provider takes the whole pool down.
        value: ${{ jobs.pool.outputs.runner_hosts_proven }}

permissions:
  contents: read

jobs:
  pool:
    name: Provision ephemeral runner pool on Akash
    runs-on: ubuntu-latest
    outputs:
      dseq: ${{ steps.provision.outputs.dseq }}
      provision_healthy: ${{ steps.provision.outputs.provision_healthy }}
      runners_online: ${{ steps.provision.outputs.runners_online }}
      failure_reason: ${{ steps.pat.outputs.failure_reason || steps.group-binding.outputs.failure_reason || steps.provision.outputs.failure_reason || steps.candidates.outputs.failure_reason }}
      wallet_free_usd: ${{ steps.provision.outputs.wallet_free_usd }}
      runner_hosts_proven: ${{ steps.candidates.outputs.proven_hosts }}
      wallet_index: 'deprecated'
      wallet_address: ${{ steps.provision.outputs.wallet_address }}
      deployment_group: ${{ steps.render.outputs.deployment_group }}
      runner-targets: ${{ steps.render.outputs.runner_targets }}
      runner-labels: ${{ steps.render.outputs.slot_labels }}
      runner-ids: ${{ steps.provision.outputs.runner_ids }}
      runner-names: ${{ steps.provision.outputs.runner_names }}
      operation-label: ${{ steps.render.outputs.operation_label }}
    # Every `run` below needs just-akash's OWN source, never the caller's checkout.
    defaults:
      run:
        working-directory: .just-akash
    steps:
      # CHECK OUT just-akash, NOT THE CALLER. A reusable workflow's job runs in the
      # CALLER's context, so `github.repository` is THEIR repo and a bare checkout
      # fetches THEIR code. `uv run --with .` then installs the caller's package (or
      # fails outright when they have no pyproject.toml), `just-akash` is never on PATH,
      # and `python -m just_akash.runner_candidates` raises ModuleNotFoundError. This
      # workflow could therefore only ever have worked inside this repo — and nothing
      # here calls it, so that was never exercised.
      #
      # ⛔ THE PIN IS AN INPUT, NOT A DERIVED VALUE, AND IT CANNOT BE DERIVED.
      # GitHub exposes NO context giving a reusable workflow its own revision:
      # `github.workflow_ref` / `github.workflow_sha` name the CALLER's entry
      # workflow, and `job.*` carries only check_run_id/container/services/status.
      # The previous code used `job.workflow_sha`, which actionlint reports as
      # "property not defined in object type"; it evaluated to the EMPTY STRING and
      # checkout therefore took the default branch. Every runner was provisioned from
      # main's tip at deploy-second while the caller believed their pin was honoured
      # — an unpinned supply-chain window that reads as pinned (#184, same class as
      # #182's `github.organization`, and a recurrence of #1128).
      #
      # Tracking a branch would let the classification tables, the SDL and the
      # provider-qualification bar all change under a consumer whose pin never moved,
      # which is the whole reason they pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.just-akash-repository }}
          ref: ${{ inputs.just-akash-ref }}
          path: .just-akash
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # A PAT EXPIRY MUST NOT BE SILENT. Without this the runner simply never registers,
      # the pool times out after ~15 minutes, and the run reports RUNNER_NEVER_REGISTERED
      # — indistinguishable from a provider that leases and never schedules. That reading
      # sends the investigation at providers, or at Akash, and the standing fix becomes
      # "switch back to hosted runners", which is the bill this workflow exists to remove.
      #
      # One API call turns 15 silent minutes into an immediate, named failure.
      # ⛔ `RC=$?` ON A LINE OF ITS OWN NEVER RAN. This step's shell is `bash -e {0}`
      # (the Actions default), and `set -uo pipefail` does NOT clear `-e`. A bare
      # `VAR=$(cmd)` whose command fails is itself a failing command, so `-e` killed
      # the shell AT the assignment — before `RC` was read, before `CODE` was parsed,
      # and before any diagnostic could print.
      #
      # ⇒ The step exited 1 with NO annotation and NO summary. Every word of the
      #   "CI is not broken, Akash is fine, and no provider is at fault" message —
      #   written precisely so a credential failure would not be misread as a provider
      #   outage — was unreachable exactly when it was needed.
      #
      #   Measured on blazing: `Provision Fast-Tests pool` failed 23 consecutive times
      #   on main, and its check annotation was the bare string "Process completed with
      #   exit code 1". Nobody could tell whether the PAT had expired, the org listing
      #   was rate-limited, or a provider was down — which is the exact confusion
      #   `failure_reason` exists to prevent.
      #
      # ⛔ AND A NONZERO EXIT IS NOT A VERDICT. Mapping every failure to
      #   RUNNER_PAT_INVALID re-created that same defect one level up: 401, 403, 404,
      #   429, 5xx and a transport failure with no HTTP response at all all reported
      #   "your PAT is invalid", and `${CODE:-401}` ASSERTED a 401 that had never been
      #   received. A preflight whose stated purpose is saying WHY it failed must not
      #   collapse five causes into one. Classify, then conclude — and when there is no
      #   status, say so rather than inventing the worst one.
      #
      # ⚠ This prose lives OUT here on purpose. Comments inside a `run:` scalar count
      # toward the job's size, and an oversized job makes GitHub build zero jobs with no
      # log — Borduas-Holdings/blazing#664, just-akash#247. Out here the parser drops them.
      - name: Preflight — runner administration credential is present
        id: pat
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "failure_reason=RUNNER_PAT_MISSING" >> "$GITHUB_OUTPUT"
            echo "::error title=GH_RUNNER_PAT is not set::JIT creation and exact-id cleanup require organization self-hosted-runner write permission."
            exit 1
          fi

      - name: Verify runner group is bound to this repository and workflow
        id: group-binding
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
          ORG: ${{ inputs.github-org }}
          RUNNER_GROUP_ID: ${{ inputs.runner-group-id }}
          CALLER_REPOSITORY_ID: ${{ github.repository_id }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if ! uv run --with . python -m just_akash.jit_pool verify-binding \
              --org "$ORG" --group-id "$RUNNER_GROUP_ID" \
              --repository-id "$CALLER_REPOSITORY_ID" \
              --workflow-ref "$CALLER_WORKFLOW_REF" \
              --github-output "$GITHUB_OUTPUT"; then
            echo "failure_reason=RUNNER_GROUP_BINDING_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error title=Runner group is not exclusively bound to this caller::No JIT identity or Akash deployment was created."
            exit 1
          fi

      - name: Select providers
        id: candidates
        env:
          AKASH_PROVIDERS_SPEC: ${{ inputs.providers }}
        run: |
          set -uo pipefail
          if ! uv run --with . python -m just_akash.runner_candidates \
                 --providers "${AKASH_PROVIDERS_SPEC:-}" --github-output; then
            echo "failure_reason=NO_ELIGIBLE_BIDDER" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Render runner SDL
        id: render
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
          RUNNER_SLOTS: ${{ inputs.runner-slots }}
          RUNNER_GROUP_ID: ${{ steps.group-binding.outputs.verified_group_id }}
          PLACEMENT_KEY: ${{ inputs.placement-key }}
          CREATE_OPERATION: ${{ inputs.create-operation }}
          # Required for the attribution stamp below. github.run_id is numeric and
          # server-supplied; it is not caller-controlled.
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # ⛔ FAIL CLOSED ON THE ONE INPUT WHOSE FAILURE MODE IS SILENT. An empty or
          # foreign placement key does not break the deploy — it produces a lease nobody
          # can claim, or one a sibling's sweeper will close mid-CI, and both look like a
          # provider fault from here. The three refusals below are the three ways it has
          # actually gone wrong on this wallet:
          #   * blank            — `group_spec.name` must be non-empty on chain, and a
          #                        caller passing "" would fail at MsgCreateDeployment
          #                        with a message about the SDL, not about this input.
          #   * dcloud           — the network-wide DEFAULT placement name, used by most
          #                        SDLs on Akash and owned by nobody. Measured in
          #                        Borduas-Holdings/blazing 2026-09-02: its killcron probe
          #                        stamped `dcloud`, so no prefix could claim it without
          #                        also claiming strangers' deployments.
          #   * dfci-infra-*     — the SIBLING's prefix, which its sweeper REAPS on a
          #                        schedule. just_akash/provenance.py:66 keeps this value
          #                        as SIBLING_REAPED_PREFIX and a test pins the two equal,
          #                        so this literal cannot drift from the module's.
          # ⛔ NORMALISE BEFORE JUDGING, OR THE JUDGEMENT IS BYPASSABLE. `dcloud ` with a
          # trailing space does not match the `dcloud` pattern below, so an unnormalised
          # value walks straight past the reserved-key checks and is then written into the
          # SDL — where the whitespace is silently swallowed by the YAML parser and the
          # deployment is stamped `dcloud` after all. Raised by CodeRabbit on the PR that
          # added this input.
          #
          # ⚠ TRIM THE ENDS, DO NOT DELETE ALL WHITESPACE. Deleting it everywhere turns an
          # embedded newline into a silent JOIN — `x\ny` became the perfectly valid key
          # `xy` and was accepted, which is the caller getting a different marker than it
          # asked for. Trimming leaves an interior character to fail the shape check below,
          # so a surprising value is REFUSED rather than quietly repaired.
          PLACEMENT_KEY="${PLACEMENT_KEY#"${PLACEMENT_KEY%%[![:space:]]*}"}"
          PLACEMENT_KEY="${PLACEMENT_KEY%"${PLACEMENT_KEY##*[![:space:]]}"}"
          # ⛔ AND THE KEY IS INTERPOLATED INTO A YAML HEREDOC, so its SHAPE is not
          # cosmetic: a value containing `:` or a newline does not produce a bad key, it
          # produces a DIFFERENT DOCUMENT. Restricting to what a placement key can
          # actually be closes that as well as the whitespace case — one rule instead of a
          # list of forbidden characters nobody will keep current.
          case "${PLACEMENT_KEY}" in
            *[!A-Za-z0-9._-]*|-*|.*|"")
              echo "::error title=runner-pool::placement-key '${PLACEMENT_KEY}' is not a plain placement key. It is interpolated into the SDL, so it must match [A-Za-z0-9][A-Za-z0-9._-]* — anything else can restructure the document rather than name a key." >&2
              exit 2 ;;
          esac
          case "${PLACEMENT_KEY}" in
            dcloud|dcloud-*) echo "::error title=runner-pool::placement-key '${PLACEMENT_KEY}' is the Akash-wide default placement name, owned by nobody. A reaper aimed at it would match strangers' deployments. Namespace it to your repo." >&2; exit 2 ;;
            dfci-infra-*)    echo "::error title=runner-pool::placement-key '${PLACEMENT_KEY}' is the SIBLING repo's prefix, which its sweeper reaps on a schedule. Stamping it would have that sweeper close this pool mid-CI." >&2; exit 2 ;;
          esac
          # ── ATTRIBUTION IS NOT OPTIONAL ─────────────────────────────────────────────
          # ⛔ THIS IS WHAT MAKES A LEAKED POOL IMPOSSIBLE TO CREATE RATHER THAN MERELY
          # DETECTABLE. Before this, `placement-key` said WHOSE a deployment is and nothing
          # said WHETHER IT IS STILL NEEDED, so every reaper had to fall back to age -- a
          # proxy. Measured on one shared wallet 2026-09-08: 112 of 128 active deployments
          # carried no run reference at all, and a consumer's 6h age floor left 69 of 83
          # pools protected-and-unreapable at any instant, because a floor as the PRIMARY
          # rule guarantees a standing population of `floor x leak-rate`.
          #
          # ⚠ AND `tag-prefix` DOES NOT DO THIS, THOUGH ITS DOCS AT THE TOP OF THIS FILE SAY
          # IT DOES. `just-akash tag` writes .tags.json inside the INSTALLED PACKAGE
          # DIRECTORY (api.py:31), which every fresh `uvx` install destroys, so the run id
          # never leaves the runner. A consumer built an hourly sweeper on that tag and it
          # reported "47 active deployments, 0 carry a ci-<run_id> tag ... Filter is working
          # as designed; nothing to sweep" while having never reclaimed a lease. See #311.
          #
          # ⇒ The placement key is the only marker that is author-controlled, written
          # ATOMICALLY inside MsgCreateDeployment, immutable afterwards, and readable from
          # the chain with ZERO auth -- which is what a sweeper in another repo, holding no
          # key for this wallet, actually has.
          #
          # ⚠ IDEMPOTENT ON PURPOSE. blazing#962 stamps caller-side, and Blazing-Back has
          # shipped `dfci-infra-runner-run-<id>-end` for months. Double-stamping would give
          # them a name their own sweeper's `run-(\d+)` no longer matches -- so a callee
          # that "improved" attribution would silently DISABLE it for the two consumers
          # already doing it right.
          # ⛔ THE IDEMPOTENCY TEST MUST VALIDATE THE SEGMENT, NOT JUST SPOT `-run-`.
          #    `*-run-[0-9]*` also matches `foo-run-1abc-end`, which would be treated as
          #    already attributed and skip stamping -- producing a pool whose run segment
          #    no sweeper's `run-([0-9]+)` can resolve. That is an UNATTRIBUTABLE pool
          #    created by the very block whose job is to make attribution mandatory, and it
          #    would look stamped to a human reading the name.
          #
          #    So: extract the segment after the LAST `-run-`, up to the next `-`, and
          #    require it to be digits. Malformed REFUSES rather than stamping on top --
          #    `foo-run-1abc-end-run-123-end` carries two run segments and the first one
          #    wins for any greedy matcher.
          # The external broker allocates the operation ordinal. The helper validates
          # and carries it unchanged into both the on-chain idv2 identity and the
          # operation-scoped GitHub label. A run-only legacy key is refused.
          uv run --with . python -m just_akash.jit_pool identity \
            --placement-prefix "$PLACEMENT_KEY" --runner-label "$RUNNER_LABEL" \
            --create-operation "$CREATE_OPERATION" --run-id "$GH_RUN_ID" \
            --run-attempt "$GH_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
          DEPLOYMENT_GROUP=$(awk -F= '$1 == "deployment_group" {print substr($0, index($0, "=") + 1)}' "$GITHUB_OUTPUT" | tail -1)
          OPERATION_LABEL=$(awk -F= '$1 == "operation_label" {print substr($0, index($0, "=") + 1)}' "$GITHUB_OUTPUT" | tail -1)
          echo "deployment group (on-chain group_spec.name): ${DEPLOYMENT_GROUP}"
          # Validate and publish the complete slot topology before any credential is
          # minted. The encoded JIT configurations are generated later, inside each
          # provider attempt, so no failed attempt can reuse one.
          uv run --with . python -m just_akash.jit_pool topology \
            --slots "$RUNNER_SLOTS" --runner-label "$OPERATION_LABEL" \
            --group-id "$RUNNER_GROUP_ID" --github-output "$GITHUB_OUTPUT"

      # ── Why the runner listing is read in three steps, not one ────────────────
      # `gh api --paginate` emits one JSON document per page. A throttled or transient
      # failure mid-pagination is an error object — {"message":"API rate limit
      # exceeded",...} — with no `.runners` key. `.runners[]` on it raises "Cannot
      # iterate over null" and jq exits 5, and because this step runs under GitHub's
      # default `bash -e {0}`, a failing command substitution aborts AT THE ASSIGNMENT:
      # `GH_RC=$?` and the whole GITHUB_API_UNAVAILABLE branch never execute. The
      # handling was written correctly and was simply unreachable.
      #
      # MEASURED, Borduas-Holdings/blazing run 33796902050: the lease was created and
      # tagged, the wait loop printed `0/4 online` three times, then
      # `jq: error (at <stdin>:5): Cannot iterate over null (null)` and
      # `Process completed with exit code 5` — jq's runtime-error code surfacing as the
      # step's. No diagnosis, and the lease outlived the run: that DSEQ (1788463980879)
      # appears in this repo's own cleanup-stale verdict table at 0.7d as
      # `-> STALE-runner`. See issue #250 for why nothing then closed it.
      #
      # ⚠ This prose lives OUT here on purpose. Comments inside a `run:` scalar count
      # toward the job's size, and an oversized job makes GitHub build zero jobs with no
      # log — Borduas-Holdings/blazing#664. Out here the parser drops them.
      - name: Provision (retry down candidates, tag before waiting)
        id: provision
        env:
          AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
          AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
          PREFERRED_CANDIDATES_CSV: ${{ steps.candidates.outputs.preferred_candidates }}
          FALLBACK_CANDIDATES_CSV: ${{ steps.candidates.outputs.fallback_candidates }}
          STANDING_EXCLUDED_CSV: ${{ steps.candidates.outputs.excluded_candidates }}
          ORG: ${{ inputs.github-org }}
          RUNNER_LABEL: ${{ inputs.runner-label }}
          OPERATION_LABEL: ${{ steps.render.outputs.operation_label }}
          RUNNER_SLOTS: ${{ inputs.runner-slots }}
          VERIFIED_RUNNER_GROUP_ID: ${{ steps.group-binding.outputs.verified_group_id }}
          RUNNER_IMAGE: ${{ inputs.runner-image }}
          CPU: ${{ inputs.cpu }}
          MEMORY: ${{ inputs.memory }}
          STORAGE: ${{ inputs.storage }}
          POOL_SIZE: ${{ steps.render.outputs.slot_count }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CREATE_OPERATION: ${{ inputs.create-operation }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          MAX_ATTEMPTS: '3'
          RUNNER_WAIT_TRIES: ${{ inputs.runner-wait-tries }}
          EXPECTED_RUNNER_VERSION: ${{ inputs.expected-runner-version }}
          REQUIRED_DEPOSIT_USD: ${{ inputs.required-deposit-usd }}
          PROVIDER_SELECT: ${{ inputs.provider-select }}
          DEPLOYMENT_GROUP: ${{ steps.render.outputs.deployment_group }}
        run: |  # pragma: allowlist secret
          set -uo pipefail

          # Wallet selection belongs to just-akash. It receives the complete pool,
          # measures authoritative free credit, and chooses the richest funded account.
          # No key or positional index crosses a step boundary.

          # An ARRAY, not a string. Both this and the provider list rely on word
          # splitting, so quoting them breaks the command and NOT quoting them is SC2086.
          # Arrays are the only form that is both correct and lint-clean.
          JA=(uv run --with . just-akash)
          JIT=(uv run --with . python -m just_akash.jit_pool)

          cleanup_jit_attempt() {
            if ! "${JIT[@]}" cleanup --journal "$JIT_JOURNAL"; then
              echo "failure_reason=JIT_REGISTRATION_CLEANUP_FAILED" >> "$GITHUB_OUTPUT"
              echo "::error title=Exact JIT runner cleanup failed::Refusing another provider attempt while a prior attempt's runner identities remain registered."
              return 1
            fi
          }

          # A free-text input feeding `seq`: junk would make the wait loop a no-op and
          # every pool instantly "never registered". Clamp like MIN_POOL below.
          case "${RUNNER_WAIT_TRIES}" in ''|*[!0-9]*) RUNNER_WAIT_TRIES=90 ;; esac
          [ "$RUNNER_WAIT_TRIES" -ge 1 ] 2>/dev/null || RUNNER_WAIT_TRIES=90

          PREFERRED_CANDIDATES=$(printf '%s' "${PREFERRED_CANDIDATES_CSV:-}" | tr ',' '\n' | sed '/^$/d')
          FALLBACK_CANDIDATES=$(printf '%s' "${FALLBACK_CANDIDATES_CSV:-}" | tr ',' '\n' | sed '/^$/d')
          # Standing exclusions and runtime failures share one exclusion input.
          # The former arrive from runner_deny; the latter are appended below.
          EXCLUDED=$(printf '%s' "${STANDING_EXCLUDED_CSV:-}" | tr ',' ' ')
          SAW_BID=0
          SAW_SEQ_CONTENTION=0

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::provision attempt $attempt/$MAX_ATTEMPTS"
            PROV_ARGS=()
            # Keep operator-preferred and measured runner hosts in the auction's
            # preferred tier. Merely
            # sorting one --provider list is ineffective: the shared auction chooses
            # the cheapest member of that tier, so a cheaper unproven host can still
            # capture the lease. --backup-provider is eligible only when no proven
            # host bids during the complete collection window.
            for p in $PREFERRED_CANDIDATES; do
              case " $EXCLUDED " in *" $p "*) continue ;; esac
              PROV_ARGS+=(--provider "$p")
            done
            for p in $FALLBACK_CANDIDATES; do
              case " $EXCLUDED " in *" $p "*) continue ;; esac
              PROV_ARGS+=(--backup-provider "$p")
            done

            # Never degrade an exhausted/denied allowlist into unrestricted
            # marketplace selection; that would re-admit every standing trap.
            if [ "${#PROV_ARGS[@]}" -eq 0 ]; then
              echo "failure_reason=NO_ELIGIBLE_BIDDER" >> "$GITHUB_OUTPUT"
              echo "::error title=No eligible provider remains::All configured preferred and fallback providers are standing-denied or failed during this run."
              echo "::endgroup::"; exit 1
            fi

            # --select reaches the CLI ONLY when the consumer chose a policy: an empty
            # value contributes NO flag (`--select ""` is an argparse exit 2, and this
            # call's deliberate `|| true` would swallow it into silent retry rounds).
            # An unknown value is rejected HERE so a typo fails fast under its own name
            # instead of burning three bid windows as an apparent market failure.
            SELECT_ARGS=()
            case "${PROVIDER_SELECT:-}" in
              "") ;;
              cheapest|emptiest) SELECT_ARGS=(--select "$PROVIDER_SELECT") ;;
              *) echo "::error title=provider-select::must be 'cheapest' or 'emptiest', got '${PROVIDER_SELECT}'"; exit 1 ;;
            esac

            # Create every GitHub identity inside this provider attempt. The helper
            # fsyncs each exact id/name before returning and never journals or prints
            # the encoded configurations.
            JIT_DIR="${RUNNER_TEMP}/just-akash-jit-${RUN_ID}-${RUN_ATTEMPT}-${attempt}"
            JIT_JOURNAL="${JIT_DIR}/identities.json"
            JIT_SDL="${JIT_DIR}/runner-sdl.yaml"
            JIT_OUTPUT="${JIT_DIR}/outputs"
            mkdir -m 700 "$JIT_DIR"
            : > "$JIT_OUTPUT"
            chmod 600 "$JIT_OUTPUT"
            if ! "${JIT[@]}" prepare \
                --org "$ORG" --group-id "$VERIFIED_RUNNER_GROUP_ID" --slots "$RUNNER_SLOTS" \
                --runner-label "$RUNNER_LABEL" --operation-label "$OPERATION_LABEL" \
                --repository "$SOURCE_REPOSITORY" \
                --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
                --provider-attempt "$attempt" --image "$RUNNER_IMAGE" \
                --placement "$DEPLOYMENT_GROUP" --cpu "$CPU" --memory "$MEMORY" \
                --storage "$STORAGE" --journal "$JIT_JOURNAL" --sdl "$JIT_SDL" \
                --github-output "$JIT_OUTPUT"; then
              echo "failure_reason=JIT_CONFIGURATION_FAILED" >> "$GITHUB_OUTPUT"
              echo "::error title=JIT runner configuration failed::No Akash create was attempted. Any identities returned before the failure were removed by exact id."
              echo "::endgroup::"; exit 1
            fi
            # Publish exact identities before the Akash create, for the same reason DSEQ
            # is published immediately after create: later cancellation must not erase
            # the recovery handle. The file contains ids/names only, never configs.
            cat "$JIT_OUTPUT" >> "$GITHUB_OUTPUT"

            # Bind one measured wallet through the create instead of ranking twice.
            # deploy re-resolves this exact owner and refuses before create if its key
            # or available credit changed.
            RECEIPT_OWNER=$("${JIT[@]}" select-owner --deposit-usd "$REQUIRED_DEPOSIT_USD")
            RECEIPT_PATH="${JIT_DIR}/deployment-receipt.json"
            RECEIPT_DIGEST=$(shasum -a 256 "$JIT_SDL" | awk '{print $1}')
            RECEIPT_OPERATION="broker:${CREATE_OPERATION}:github:${RUN_ID}:${RUN_ATTEMPT}:g1"
            : > /tmp/ja.log
            "${JA[@]}" deploy --sdl "$JIT_SDL" --deposit "$REQUIRED_DEPOSIT_USD" --bid-wait 60 \
              --bid-wait-retry 120 "${SELECT_ARGS[@]}" "${PROV_ARGS[@]}" \
              --receipt-path "$RECEIPT_PATH" \
              --receipt-expected-owner "$RECEIPT_OWNER" \
              --receipt-expected-group "$DEPLOYMENT_GROUP" \
              --receipt-artifact-sha256 "$RECEIPT_DIGEST" \
              --receipt-operation-id "$RECEIPT_OPERATION" 2>&1 | tee /tmp/ja.log || true
            # The submitted manifest now owns delivery. Remove local secret-bearing bytes
            # before parsing output or entering any wait/diagnostic branch.
            JIT_SDL_PATH="$JIT_SDL" python -c 'import os; from pathlib import Path; Path(os.environ["JIT_SDL_PATH"]).unlink(missing_ok=True)'
            DSEQ=$(awk -F': +' '/^[[:space:]]*DSEQ:/{print $2; exit}' /tmp/ja.log || true)
            # ⭐ PUBLISH THE DSEQ THE MOMENT IT EXISTS — before tagging, before the
            # registration wait, before anything can fail or be cancelled. The
            # success block below also writes it, but a run that dies mid-wait
            # (cancellation, timeout, registration failure) never reaches that
            # block, and the internalised teardown job would then have NO identity
            # to close — which is exactly how leases outlived their runs for 23.5h
            # (census 2026-08-23: 13 × just-akash-runner.<hash> = 65 ACT). Each
            # round overwrites this, so the surviving value names the CURRENT lease;
            # an already-closed round's dseq is a harmless no-op for the teardown
            # ("already closed|not found" → verified-closed). (#1439 pattern.)
            echo "dseq=$DSEQ" >> "$GITHUB_OUTPUT"
            PROVIDER=$(awk -F': +' '/^[[:space:]]*Provider:/{print $2; exit}' /tmp/ja.log || true)
            WALLET=$(awk -F': +' '/^[[:space:]]*Wallet:/{print $2; exit}' /tmp/ja.log || true)
            RECEIPT_RC=0
            RECEIPT_JSON=$("${JIT[@]}" receipt --path "$RECEIPT_PATH" 2>/tmp/receipt.err) || RECEIPT_RC=$?
            if [ "$RECEIPT_RC" -ne 0 ]; then
              cleanup_jit_attempt || exit 1
              echo "failure_reason=CREATE_RECEIPT_UNREADABLE" >> "$GITHUB_OUTPUT"
              echo "::error title=Create receipt unreadable::Refusing another create because the previous create outcome cannot be reconciled: $(tail -1 /tmp/receipt.err 2>/dev/null)"
              echo "::endgroup::"; exit 1
            fi
            RECEIPT_STATE=$(printf '%s' "$RECEIPT_JSON" | jq -er '.state')
            RECEIPT_DSEQ=$(printf '%s' "$RECEIPT_JSON" | jq -r '.dseq // empty')
            RECEIPT_OWNER=$(printf '%s' "$RECEIPT_JSON" | jq -er '.expected_owner')
            if [ "$RECEIPT_STATE" = "create_response_received" ]; then
              if [ -n "$DSEQ" ] && [ "$DSEQ" != "$RECEIPT_DSEQ" ]; then
                cleanup_jit_attempt || exit 1
                echo "failure_reason=CREATE_RECEIPT_CONFLICT" >> "$GITHUB_OUTPUT"
                echo "::error title=Create identities disagree::stdout dseq=$DSEQ receipt dseq=$RECEIPT_DSEQ. Refusing to retry or guess which deployment to close."
                echo "::endgroup::"; exit 1
              fi
              DSEQ="$RECEIPT_DSEQ"
              WALLET="$RECEIPT_OWNER"
            else
              # prepared/submitting cannot prove that create did not reach the server.
              # A second attempt could create a second lease, so stop. The on-chain
              # operation group remains discoverable by the scheduled prefix reaper.
              cleanup_jit_attempt || exit 1
              printf 'dseq=%s\nwallet_address=%s\nfailure_reason=CREATE_SETTLEMENT_UNOBSERVED\n' \
                "$DSEQ" "$RECEIPT_OWNER" >> "$GITHUB_OUTPUT"
              echo "::error title=Create settlement not observed::Receipt state=$RECEIPT_STATE and no DSEQ was returned. Refusing another provider attempt; reconcile the unique on-chain group $DEPLOYMENT_GROUP."
              echo "::endgroup::"; exit 1
            fi
            echo "dseq=$DSEQ" >> "$GITHUB_OUTPUT"
            # Publish the create-time owner as soon as it is available. Internal
            # rollback runs only on a failed handoff, so a success-only publication
            # leaves precisely that teardown without the bound-owner fallback.
            echo "wallet_address=$WALLET" >> "$GITHUB_OUTPUT"
            WALLET_UACT=$(awk '/^[[:space:]]*Wallet available:/{print $(NF-1); exit}' /tmp/ja.log || true)

            # A DSEQ with no provider is still a real deployment. Stop so the internal
            # cross-job teardown closes it and verifies settlement before any later run;
            # never issue another create from this ambiguous attempt.
            if [ -n "$DSEQ" ] && [ -z "$PROVIDER" ]; then
              cleanup_jit_attempt || exit 1
              echo "failure_reason=CREATE_WITHOUT_PROVIDER" >> "$GITHUB_OUTPUT"
              echo "::error title=Create returned a DSEQ without a provider::Stopping before retry. The internal teardown owns dseq=$DSEQ and must verify closure."
              echo "::endgroup::"; exit 1
            fi

            if [ -z "$DSEQ" ] || [ -z "$PROVIDER" ]; then
              cleanup_jit_attempt || exit 1
              # Classify BEFORE blaming the marketplace. A 402 is rejected before an
              # order exists, so no provider ever saw it — calling that "no bid" sends
              # the investigation at providers instead of at the balance.
              if grep -qiE 'PaymentRequiredError|Insufficient balance|HTTP 402' /tmp/ja.log 2>/dev/null; then  # pragma: allowlist secret
                echo "failure_reason=WALLET_UNDERFUNDED" >> "$GITHUB_OUTPUT"
                echo "::error title=Akash rejected the deploy: INSUFFICIENT BALANCE::No order was created and no provider was asked to bid, so retrying cannot help. Top up the wallet."
                echo "::endgroup::"; exit 1
              fi

              # ACCOUNT-SEQUENCE CONTENTION — the failure that spikes produce, and the
              # one that lies most convincingly.
              #
              # AKASH_API_KEY is ONE Cosmos account, and a Cosmos account cannot have two
              # transactions in flight: they share a sequence number, so the loser is
              # rejected with an account-sequence mismatch. Nothing in just_akash retries
              # it. This repo's own wallet-touching workflows are serialised under the
              # `akash-wallet` concurrency group precisely for this — but a REUSABLE
              # workflow cannot inherit that protection, because GitHub scopes
              # concurrency groups PER REPOSITORY. Many repos sharing one key are
              # therefore unserialisable by any group name written here.
              #
              # Without this branch the tx rejection falls through to "no lease within
              # the bid window" and, after the attempt budget, to PROVIDER_CAPACITY —
              # reporting a market outage that never happened, at exactly the moment
              # (a spike) when the real cause is our own concurrency. Retrying at once
              # just re-collides, so back off with jitter to break the lockstep.
              if grep -qiE 'account sequence mismatch|incorrect account sequence|sequence mismatch' /tmp/ja.log 2>/dev/null; then
                SAW_SEQ_CONTENTION=1
                BACKOFF=$(( (RANDOM % 20) + 10 ))
                echo "::warning::attempt $attempt: account-sequence contention on the shared wallet — backing off ${BACKOFF}s. NOT a market condition."
                sleep "$BACKOFF"
                echo "::endgroup::"; continue
              fi

              # UNCLASSIFIED, and it must SAY so rather than defaulting to the market.
              #
              # The two matchers above are not equally evidenced. The 402 signature is
              # observed. The account-sequence signature is INFERRED — from this repo's
              # own reasoning about one Cosmos account (README, provider-canary.yml),
              # not from a captured failure. The Console API proxies the chain, and the
              # one concurrency-shaped failure actually on record surfaced as a bare
              # `HTTP 500 {"error":"InternalServerError"}` with no Cosmos detail in it
              # at all — so the mismatch text may never reach this log.
              #
              # A matcher that can never fire is worse than none: WALLET_TX_CONTENTION
              # would read as a handled case while every occurrence fell through to
              # PROVIDER_CAPACITY, which is the fabricated-outage verdict this whole
              # workflow exists to stop reporting. Printing the raw output is what turns
              # the next occurrence into evidence, so the matcher can be corrected from
              # a real string instead of a plausible one.
              echo "::group::unclassified deploy failure — raw output"
              tail -40 /tmp/ja.log 2>/dev/null || echo "(no output captured)"
              echo "::endgroup::"
              echo "::warning::attempt $attempt: no lease within the bid window — cause NOT classified. The raw output is in the group above; if it names an account-sequence or transaction error, that string belongs in this workflow's matcher."
              echo "::endgroup::"; continue
            fi
            SAW_BID=1

            # Tag FIRST: if this job is cancelled between deploy and teardown, only a
            # tagged lease can be reaped by the caller's sweeper.
            "${JA[@]}" tag --dseq "$DSEQ" --name "${TAG_PREFIX}-${RUN_ID}" \
              || echo "::warning::tag failed for dseq=$DSEQ — a sweeper will not see it"

            # The landing read is scoped to the numeric group that passed policy
            # verification. Its helper consumes every page, then matches exact IDs,
            # names and labels from the durable attempt journal. It also rejects an
            # extra registration carrying this operation label: declared population is
            # a two-sided equality, not merely a lower bound.
            #
            # A failed or contradictory GitHub read is not zero runners and is never a
            # provider verdict. The wall-clock deadline remains bounded even when error
            # retries use the slower cadence.
            ONLINE=0
            API_OK=0
            WAIT_DEADLINE=$(( $(date +%s) + RUNNER_WAIT_TRIES * 5 ))
            while [ "$(date +%s)" -lt "$WAIT_DEADLINE" ]; do
              # Read the runner population through the verified group, with complete
              # pagination. The helper matches every observation by the exact journaled
              # id AND name and requires all expected labels before an online runner can
              # count. A runner from another group or with broadened routing authority
              # therefore cannot satisfy this gate merely by being online.
              GH_RC=0
              OBSERVATION=$("${JIT[@]}" observe --journal "$JIT_JOURNAL" 2>/tmp/gh-runners.err) || GH_RC=$?
              if [ "$GH_RC" -ne 0 ]; then
                echo "  verified runner-group population unreadable (rc=${GH_RC}): $(tail -1 /tmp/gh-runners.err 2>/dev/null)"
                sleep 15
                continue
              fi
              ONLINE=$(printf '%s' "$OBSERVATION" | jq -er '.online') || GH_RC=$?
              RUNNER_VERSIONS=$(printf '%s' "$OBSERVATION" | jq -r '.versions[] // "null"') || GH_RC=$?
              if [ "$GH_RC" -ne 0 ]; then
                echo "  verified runner-group observation was not parseable"
                sleep 15
                continue
              fi
              API_OK=1
              echo "  ${ONLINE:-0}/${POOL_SIZE} exact group-bound JIT runners online"
              [ "${ONLINE:-0}" -ge "${POOL_SIZE}" ] && break
              sleep 5
            done

            # Never completed a trustworthy group-population read: the pool may be
            # healthy, but its routing contract was not observable. Close the lease (an unverifiable pool cannot be handed to
            # the caller, and leaving it holds escrow), but do NOT exclude the provider
            # and do NOT spend another attempt — re-selecting providers cannot fix
            # GitHub's API, and a second attempt just doubles the request load that is
            # the most likely cause.
            if [ "$API_OK" = "0" ]; then
              for _try in 1 2 3; do
                "${JA[@]}" destroy --dseq "$DSEQ" --expected-owner "$WALLET" --expected-group "$DEPLOYMENT_GROUP" -y 2>&1 | tee /tmp/ja-destroy.log && break
                grep -qi "Deployment closed" /tmp/ja-destroy.log && break
                sleep 5
              done
              cleanup_jit_attempt || exit 1
              echo "failure_reason=GITHUB_API_UNAVAILABLE" >> "$GITHUB_OUTPUT"
              echo "::error title=Could not verify the runner-group population — this is NOT a provider fault::Every complete read of runner group ${VERIFIED_RUNNER_GROUP_ID} failed or disagreed with the exact journaled IDs, names, and labels. The pool was never safe to route. Do not runner_deny anyone over this."
              echo "::endgroup::"; exit 1
            fi

            if [ "${ONLINE:-0}" -lt "${POOL_SIZE}" ]; then
              echo "::warning::attempt $attempt: ${ONLINE:-0}/${POOL_SIZE} exact JIT runners online on $PROVIDER — discarding the incomplete one-job pool"
              # Escrow-critical, and deliberately a literal locally-parsed --dseq so a
              # destroy-safety lint can prove this only tears down what this loop made.
              for _try in 1 2 3; do
                "${JA[@]}" destroy --dseq "$DSEQ" --expected-owner "$WALLET" --expected-group "$DEPLOYMENT_GROUP" -y 2>&1 | tee /tmp/ja-destroy.log && break
                grep -qi "Deployment closed" /tmp/ja-destroy.log && break
                sleep 5
              done
              cleanup_jit_attempt || exit 1
              echo "failure_reason=RUNNER_POPULATION_INCOMPLETE" >> "$GITHUB_OUTPUT"
              echo "::error title=Incomplete pool destroyed::Stopping before another create. The internal teardown must independently verify closure for dseq=$DSEQ."
              echo "::endgroup::"; exit 1
            fi

            # ---- LANDING GATE, part 2 of 2: a corpse that registered still counts as online ----
            # The count above cannot tell a working runner from one that registered, took the
            # mandated update, and died -- both list as `online`. Part 1 projected the version
            # out of that same read; this refuses the lease when it is missing.
            #
            # ⚠ THE COST IS NOT LOCAL TO THIS POOL, which is why the lease is closed rather than
            # merely warned about. Every restart adds an org runner registration, and the org
            # listing's PAGE COUNT sets the pre-strike CI quota floor for every repo on the
            # shared PAT. Measured 2026-09-05: 1,732 registrations org-wide; a 300-runner sample
            # was 300/300 offline, 0 busy, version: null. A repo can be refused CI by a pump it
            # does not run and cannot see.
            #
            # ⚠ NO VERSION LITERAL LIVES HERE. `expected-runner-version` is optional and empty by
            # default, so the gate's standing behaviour is to reject only a MISSING version -- the
            # corpse. Pinning a number here would be a static floor, the exact defect the
            # auto-update mandate exists to avoid, reintroduced by its own guard.
            # ⚠ AN EMPTY PROJECTION HERE IS A CONTRADICTION, NOT A CLEAN POOL. This point is
            # only reached once ONLINE >= MIN_POOL, so the same read that produced N ids must
            # produce N versions. Zero means the projection failed while the count succeeded,
            # and accepting that would let an unreadable verdict pass as a healthy one -- the
            # failure this gate exists to stop, arriving through the gate itself.
            #
            # Found by testing the decision against synthetic inputs. The conformance rule
            # passes on the PROJECTION alone, so it cannot see whether the decision is sound;
            # a gate that satisfies its own rule and accepts everything is the shape this
            # whole standard exists to refuse.
            if [ -z "${RUNNER_VERSIONS:-}" ]; then
              echo "::warning title=Landing gate: version projection empty for a pool reporting ${ONLINE} online::attempt $attempt: the runner listing yielded ${ONLINE} online id(s) and 0 versions on $PROVIDER — the read disagrees with itself, so this lease is discarded rather than trusted."
              for _try in 1 2 3; do
                "${JA[@]}" destroy --dseq "$DSEQ" --expected-owner "$WALLET" --expected-group "$DEPLOYMENT_GROUP" -y 2>&1 | tee /tmp/ja-destroy.log && break
                grep -qi "Deployment closed" /tmp/ja-destroy.log && break
                sleep 5
              done
              cleanup_jit_attempt || exit 1
              echo "failure_reason=RUNNER_VERSION_UNVERIFIED" >> "$GITHUB_OUTPUT"
              echo "::error title=Runner version population unverified::Stopping before another create. The internal teardown must independently verify closure for dseq=$DSEQ."
              echo "::endgroup::"; exit 1
            fi
            if [ -n "${RUNNER_VERSIONS:-}" ]; then
              # ⚠ -F ON EVERY VERSION COMPARISON. Without it grep reads the pattern as a
              # REGEX, and a version is full of `.` — which matches any character. Measured:
              # against versions [2.337.0, 2X337X0, 2.336.0] with EXPECTED=2.337.0,
              # `grep -cvx` counts 1 wrong and `grep -cvxF` counts 2. The regex form treats
              # 2X337X0 as CORRECT, so it UNDER-counts wrong versions — a gate failing open,
              # which is the direction that lets a bad pool through.
              GATE_DEAD=$(printf '%s\n' "$RUNNER_VERSIONS" | grep -cxF -- "null" || true)
              GATE_WRONG=0
              if [ -n "${EXPECTED_RUNNER_VERSION:-}" ]; then
                GATE_WRONG=$(printf '%s\n' "$RUNNER_VERSIONS" | grep -vxF -- "null" | grep -cvxF -- "${EXPECTED_RUNNER_VERSION}" || true)
              fi
              if [ "${GATE_DEAD:-0}" -gt 0 ] || [ "${GATE_WRONG:-0}" -gt 0 ]; then
                echo "::warning title=Landing gate: registered runners are not running::attempt $attempt: ${GATE_DEAD} online runner(s) report NO version and ${GATE_WRONG} report an unexpected one on $PROVIDER — discarding this lease rather than handing the caller a pool of corpses."
                printf '%s\n' "$RUNNER_VERSIONS" | sort | uniq -c | sed 's/^/    version /'
                for _try in 1 2 3; do
                  "${JA[@]}" destroy --dseq "$DSEQ" --expected-owner "$WALLET" --expected-group "$DEPLOYMENT_GROUP" -y 2>&1 | tee /tmp/ja-destroy.log && break
                  grep -qi "Deployment closed" /tmp/ja-destroy.log && break
                  sleep 5
                done
                cleanup_jit_attempt || exit 1
                echo "failure_reason=RUNNER_VERSION_REJECTED" >> "$GITHUB_OUTPUT"
                echo "::error title=Runner version rejected::Stopping before another create. The internal teardown must independently verify closure for dseq=$DSEQ."
                echo "::endgroup::"; exit 1
              fi
            fi

            {
              echo "dseq=$DSEQ"
              echo "provider=$PROVIDER"
              echo "wallet_address=$WALLET"
              if [ -n "$WALLET_UACT" ]; then
                echo "wallet_free_usd=$(awk -v value="$WALLET_UACT" 'BEGIN { printf "%.6f", value / 1000000 }')"
              fi
              echo "runners_online=${ONLINE}/${POOL_SIZE}"
              echo "provision_healthy=true"
            } >> "$GITHUB_OUTPUT"
            echo "pool of ${ONLINE} online on ${PROVIDER} (dseq=${DSEQ})"
            echo "::endgroup::"; exit 0
          done

          # Name the world this failure came from. "infra" for everything is what made
          # the hosted-runner fallback invisible.
          if [ "$SAW_BID" = "1" ]; then
            # ⛔ RE-CHECK THE CREDENTIAL BEFORE NAMING A PROVIDER. This is the ONE
            # instant where the two causes are still distinguishable, and the verdict
            # below is the only one in this workflow that writes a durable accusation
            # about a third party: runner_candidates.py documents `runner_deny` as
            # "leases but never schedules the runner pod — NEVER try it".
            #
            # The preflight at the top of this job already fails fast on a PAT that is
            # invalid BEFORE provisioning, and the poll loop already refuses to fold an
            # unreadable listing into "zero runners" (see GITHUB_API_UNAVAILABLE above).
            # Neither covers the remaining case: a credential that stops working DURING
            # the ~15-minute window while the listing itself still reads. The runner
            # container mints its own registration token with this same PAT, so it 403s
            # and crash-loops while our polls keep succeeding and keep reporting zero.
            # From here that is byte-identical to a provider that leased and never
            # scheduled — and the provider is the one that gets the record.
            #
            # ⚠ This adds ONE request, on a path that has already failed. It cannot slow
            # a healthy run because a healthy run exits at the `exit 0` above.
            #
            # ⛔ ONE request, not two — same reason the preflight says so: two calls can
            # disagree, and reporting a status line from a call that succeeded while
            # branching on one that failed names a code that never belonged to the failure.
            # ⛔ THE WRITE VERB HERE TOO, AND THIS SITE IS THE MORE SERIOUS ONE.
            # This step decides whether to blame a PROVIDER. Its own 401 text says the
            # container "mints its registration token with this same credential" — it
            # NAMED the write path while testing a read. So a PAT that can list runners
            # but cannot mint returned 200 here, the check fell through, and the run
            # accused a host that did nothing wrong. A preflight failing a run is
            # recoverable; a fabricated provider fault is somebody else's reputation.
            VERDICT_RESP=$(gh api "orgs/${ORG}/actions/runner-groups/${VERIFIED_RUNNER_GROUP_ID}" -i 2>&1) || true
            VERDICT_CODE=$(printf '%s' "$VERDICT_RESP" | awk 'NR==1 && $1 ~ /^HTTP/ {print $2}')
            case "${VERDICT_CODE:-000}" in
              200) : ;;
              401)
                echo "failure_reason=RUNNER_PAT_INVALID" >> "$GITHUB_OUTPUT"
                echo "::error title=The runner PAT died mid-run — this is NOT a provider fault::The required runner group is no longer readable (HTTP 401). Do NOT runner_deny anyone on this run."
                exit 1 ;;
              403|429)
                echo "failure_reason=GITHUB_API_UNAVAILABLE" >> "$GITHUB_OUTPUT"
                echo "::error title=Our API budget was exhausted mid-run — this is NOT a provider fault::The required runner group read returned HTTP ${VERDICT_CODE}. Do NOT runner_deny anyone on this run."
                exit 1 ;;
              *)
                echo "failure_reason=INDETERMINATE" >> "$GITHUB_OUTPUT"
                echo "::error title=Runners never registered and authority could not be re-checked::The required runner group read returned HTTP ${VERDICT_CODE:-no status}. Do NOT runner_deny anyone on this run."
                exit 1 ;;
            esac
            echo "failure_reason=RUNNER_NEVER_REGISTERED" >> "$GITHUB_OUTPUT"
            echo "::error title=Leases won, runners never registered::A provider took the lease but the runner never came online. That provider is a candidate for runner_deny — qualify it with 'just-akash runner-probe'."
          elif [ "$SAW_SEQ_CONTENTION" = "1" ]; then
            # Checked BEFORE the capacity verdict: no order was ever created, so no
            # provider was asked to bid and the market said nothing. Reporting this as
            # PROVIDER_CAPACITY is a fabricated outage, and it fires hardest during a
            # spike — when many pools are the cause and the market is fine.
            echo "failure_reason=WALLET_TX_CONTENTION" >> "$GITHUB_OUTPUT"
            echo "::error title=The wallet could not carry the deploy: concurrent transactions::AKASH_API_KEY is ONE Cosmos account and cannot have two transactions in flight — the losers are rejected with an account-sequence mismatch, and nothing in just_akash retries it. This is NOT a market condition and NOT a provider fault. GitHub concurrency groups are scoped per repository, so they cannot serialise callers in different repos. At spike, give each concurrent provisioner its OWN Akash account, or funnel provisioning through one repo that serialises on the akash-wallet group."
          else
            echo "failure_reason=PROVIDER_CAPACITY" >> "$GITHUB_OUTPUT"
            echo "::error title=No provider bid::No eligible provider bid within the window across ${MAX_ATTEMPTS} attempts. This is a market/capacity condition, not a code failure."
          fi
          exit 1

      - name: Roll back failed JIT registrations by exact ID
        if: always() && steps.provision.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          journals=("${RUNNER_TEMP}"/just-akash-jit-*/identities.json)
          for journal in "${journals[@]}"; do
            uv run --with . python -m just_akash.jit_pool cleanup --journal "$journal"
          done

  # ── ROLLBACK BEFORE SUCCESSFUL HANDOFF ────────────────────────────────────────
  # The reusable workflow must finish before caller consumer jobs can start.
  # Closing on successful provisioning here would hand them already-dead runners.
  # Failed/cancelled provisioning keeps its internal rollback; successful provision
  # transfers cleanup to the caller's always() teardown after every consumer finishes.
  # Publish dseq early: rollback needs the created lease even if validation fails.
  # Abrupt cancellation can prevent GitHub from exposing job outputs or scheduling
  # cleanup despite always(). The independently scheduled backstop remains required;
  # this predicate does not make cancellation delivery or output retention reliable.
  teardown:
    name: Roll back failed or cancelled pool provisioning
    needs: [pool]
    if: always() && needs.pool.result != 'success'
    # ⛔ FULL PATH AT A PINNED SHA, NEVER `./`. A reusable workflow's job runs in the
    # CALLER's context, so a bare `./` resolves inside the CALLER's tree — where this
    # file does not exist. The job then cannot be created, the graph cannot be built,
    # and the consumer's run dies with `jobs=0`: a startup_failure rendered as a
    # generic "workflow file issue" against THEIR workflow, for a defect in ours.
    #
    # ⚠ IT WORKS PERFECTLY HERE, WHICH IS WHY IT SHIPPED. In this repo's own CI the
    # caller IS just-akash, so `./` resolves. A reusable workflow cannot test its own
    # cross-repo callability from inside its own repo. Measured 2026-09-03:
    # Borduas-Holdings/blazing bumped past #243 and both of its Akash workflows
    # returned startup_failure with zero jobs (just-akash#247).
    #
    # ⚠ AND IT IS A RECURRENCE. akash-github-runner#149 was the same bug one repo over,
    # with the same `jobs=0` signature; its test now records the rule verbatim:
    # "a bare `./` resolves inside the CALLER's tree […] every consumer run died with
    # jobs=0" (test_reusable_conformance_workflow.py:88).
    #
    # ⇒ The pin is not trusted, it is CHECKED:
    # test_the_nested_teardown_pin_matches_the_file_it_calls asserts the teardown at this
    # SHA is byte-identical to the working copy, so editing the teardown forces the bump
    # in the SAME change and the two cannot drift.
    # ⚠ NOT "lags by exactly one commit" — this comment said that, and the guard does not
    # check it. Commit DISTANCE is not enforceable here: a multi-commit PR or a squash
    # merge breaks it while the pin stays correct. IDENTITY is the property that matters,
    # and it is the one asserted. The test docstring records the same correction.
    #
    # ⛔ IDENTITY IS NOT SUFFICIENT ON ITS OWN, AND THIS COMMENT USED TO IMPLY IT WAS.
    # The identity guard forces this pin onto a commit whose teardown matches byte for
    # byte, and mid-PR the only such commit is the BRANCH commit — which is exactly
    # what a SQUASH MERGE destroys. #308 was squashed, leaving this line pointing at
    # d5e64da8 (`compare d5e64da8...main` -> "diverged"), so Actions could not resolve
    # the nested `uses:` while building the job graph and every downstream caller died
    # as a STARTUP FAILURE: jobs=0, no logs, nothing naming the missing ref. blazing#927
    # burned three commits on it. The previous pin survived only because ITS PR was not
    # squashed (`compare c2cad20a...main` -> "ahead").
    #
    # ⇒ So TWO independent properties are asserted, and both are required:
    #   identity     — test_the_nested_teardown_pin_matches_the_file_it_calls
    #   REACHABILITY — test_the_nested_teardown_pin_is_reachable_from_main
    # The resolution that satisfies both is to pin the POST-MERGE main SHA: byte-identical
    # to the branch commit, and an ancestor of main. Never re-pin to a branch commit after
    # its PR has merged.
    uses: Digital-Frontier-LDA/just-akash/.github/workflows/runner-teardown.yml@f50cc83698871a0e284bed1447589002dda5fd19
    with:
      dseq: ${{ needs.pool.outputs.dseq }}
      wallet-address: ${{ needs.pool.outputs.wallet_address }}
      deployment-group: ${{ needs.pool.outputs.deployment_group }}
      tag-prefix: ${{ inputs.tag-prefix }}
      runner-label: ${{ format('{0}-idv2-g1-op-{1}-attempt-{2}-run-{3}', inputs.runner-label, inputs.create-operation, github.run_attempt, github.run_id) }}
      runner-ids: ${{ needs.pool.outputs.runner-ids }}
      # ⭐ inputs.github-org, NOT github.organization — that context property DOES NOT
      # EXIST and evaluates to EMPTY STRING silently (caught by sentinel + CodeRabbit
      # review on #182; all six required checks were green on the broken form). The
      # teardown de-registers via `orgs/${ORG}/actions/runners`, and the runners
      # registered into inputs.github-org (the pool's own ORG env at :280/:332/:407),
      # so the teardown MUST name the same org the registration used — guaranteed
      # consistent by reading the SAME input, not by reconstructing it from context.
      github-org: ${{ inputs.github-org }}
      # ⛔ REQUIRED BY THE CALLEE, WITH NO DEFAULT — and omitting it did not fail HERE.
      # runner-teardown.yml declares `just-akash-ref` required. A reusable call that
      # omits a required input cannot be turned into a job, so GitHub abandons the whole
      # graph: the CONSUMER's run returns startup_failure with ZERO jobs, no logs and no
      # annotation. Measured 2026-09-03 from Borduas-Holdings/blazing#798 — both of its
      # workflows that call this one died that way, while the same branch with the
      # previous pin (017b9e0b, which had no nested teardown at all) built 14 jobs.
      # ⚠ THIS REPO'S OWN CI CANNOT SEE IT. Nothing here calls runner-pool.yml as a
      # reusable, so the broken graph is only ever built in a consumer. Same blind spot
      # as the `./` defect in #248, one input along.
      just-akash-ref: ${{ inputs.just-akash-ref }}
    secrets:
      AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
      AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}
      GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}

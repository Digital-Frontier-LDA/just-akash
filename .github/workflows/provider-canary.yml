name: Provider canary (persistent)

# ONE PERSISTENT DEPLOYMENT PER PROVIDER, kept alive, measured FROM INSIDE.
#
# provider-smoke.yml answers "can I deploy right now?" — it runs once a day and then
# deliberately erases itself (robust_destroy, the SIGINT handler, the no-leak guarantee).
# That makes an entire class of failure invisible, because it is the class that only
# happens over TIME: a provider closing the deployment on Tuesday, a container restarted
# at 03:00, egress dying for twenty minutes. A customer meets all of those, because a
# customer's deployment stays up. This workflow is the deployment that stays up.
#
# What it produces, on the `telemetry` branch for df-grafana to scrape:
#   akash_canary_reachable                  the customer-visible up/down
#   akash_canary_restarts_total             container restarts within the SAME lease
#   akash_canary_lease_replacements_total   deployments closed/lapsed and recreated
#   akash_canary_egress_fail_total          the workload could not reach the internet
#   akash_canary_dns_fail_total             ...or could not resolve
#   akash_canary_disk_write_seconds         fsync latency as the workload feels it
#   akash_canary_sched_jitter_seconds       CPU contention from the customer's side
#
# CADENCE IS 30 MINUTES, AND THE COST OF THAT IS BOUNDED BY DESIGN. The agent's counters
# are CUMULATIVE, so a coarse sampling interval loses timing precision but never loses
# events — twelve egress failures between two collections still arrive as twelve. That is
# why this can run every 30m instead of every minute without going blind, which matters
# because this repo already moved the smoke to daily to limit Actions minutes.

on:
  schedule:
    # :05 and :35, NOT :00 and :30. The smoke runs at 07:00 and a */30 schedule
    # collides with it head-on. Offsetting does not by itself make this safe (the
    # smoke can run 40 minutes), which is what the shared concurrency group below
    # is for — but it keeps the common case from queueing needlessly.
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      deploy_missing:
        description: "Deploy a canary for any provider that has none (spends escrow)"
        type: boolean
        default: true
      min_credit_usd:
        description: "Override the credit floor (0 disables gating). Blank = repo default."
        type: string
        default: ""
        required: false

# ⚠️ SHARED WITH provider-smoke.yml, and this is the important line in the file.
#
# Both workflows spend from the SAME Console-API wallet (AKASH_API_KEY) — there is
# only one. That wallet is a single Cosmos account, and a Cosmos account cannot have
# two transactions in flight: they share a sequence number, so a concurrent deploy
# from each workflow makes one of them fail with an account-sequence mismatch.
# Nothing in just_akash retries that (grepped: no sequence handling anywhere), so the
# loser is a hard failure — and the canary losing looks identical to a provider
# refusing to bid, which would be a fabricated fault in the signal.
#
# A shared group makes GitHub queue them instead of racing. The cost is that a
# collection can be delayed behind a smoke run (up to ~70 minutes, once a day), and
# that cost is near-zero BY DESIGN: the agent's counters are cumulative, so a late
# collection loses timing precision and no events. That property was built for the
# 30-minute cadence and it pays for this too.
#
# NEVER cancel in flight: a run can be mid-deploy holding a live lease.
concurrency:
  group: akash-wallet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Ensure + collect
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes to the telemetry branch
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Load SOPS secrets
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      # Prior targets + durable counters. `continue-on-error` because a first run has no
      # telemetry branch yet, which is legitimate — but note publish-canary.sh treats an
      # UNREACHABLE remote as fatal, so this cannot silently reset the counters.
      - name: Fetch prior canary state
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p prior
          git fetch --depth=1 origin telemetry || exit 0
          # `git show A:b > out` CREATES out BEFORE the command runs, so a missing file on
          # the branch leaves a ZERO-BYTE out rather than none — and the `cp ... || echo '{}'`
          # fallback downstream then copies the empty file happily. That is what broke the
          # first live dispatch. Write to a temp and keep it only if non-empty.
          for f in canary-state.json canary-targets.json; do
            if git show "FETCH_HEAD:$f" > "prior/$f.tmp" 2>/dev/null && [ -s "prior/$f.tmp" ]; then
              mv "prior/$f.tmp" "prior/$f"
            else
              rm -f "prior/$f.tmp"
            fi
          done
          ls -l prior/ || true

      - name: Resolve which providers still have a live canary
        # AKASH_PROVIDERS comes from secrets/ci.sops.env via the SOPS step above — the
        # SAME variable the smoke test uses. Deliberately not a canary-specific copy: a
        # second list could drift, and the canary and the smoke would then be measuring
        # different fleets while both looked correctly configured.
        run: |
          set -euo pipefail
          uv run just-akash list --json > listing.json
          # list rows are SUMMARIES and carry no leases, so neither the service set nor the
          # provider address is on them. details.py fetches the real thing per dseq.
          uv run python -m canary.details --listing listing.json --out details.json
          cp prior/canary-targets.json targets.json 2>/dev/null || echo '{}' > targets.json
          uv run python -m canary.ensure \
            --details details.json \
            --akash-providers "$AKASH_PROVIDERS" \
            --targets targets.json \
            --missing-out missing.txt
          echo "missing: $(cut -f1 missing.txt | tr '\n' ' ' || true)"

      # THE ONLY STEP THAT SPENDS MONEY, kept separate and visible on purpose.
      #
      # On a schedule it is gated behind the CANARY_AUTODEPLOY repository variable, so
      # merging this workflow cannot start opening leases on its own — turning it on is a
      # deliberate act. Bootstrap by dispatching this workflow manually once.
      #
      # One deploy per provider per run is the cap. A provider that keeps closing our
      # deployment therefore costs at most one lease per 30 minutes, and the resulting
      # akash_canary_lease_replacements_total is the alertable signal that it is doing so.
      # ALWAYS runs, even when deploying is disabled, because this reading is not just
      # a gate — it is published. just_akash_deploy_credit_usd is written once a day by
      # the smoke, so a dashboard shows it as current when it can be 24 hours old.
      # Reading it here puts a ~30 minute figure on the same branch.
      - name: Read deploy credit
        env:
          MIN_CREDIT_OVERRIDE: ${{ inputs.min_credit_usd }}
        run: |
          set -euo pipefail
          # DEFAULT 0 = DISABLED, and that is a correction, not a loosening.
          #
          # This gated on `balance --check`'s free_usd, which is grant MINUS escrow —
          # headroom under the DepositAuthorization Console issues to this API key. It
          # is not the account's available balance, and I had been reporting it as one.
          # Measured 2026-08-06: free_usd read $2.31 while the Console account held
          # $573.38, and a deploy at that moment SUCCEEDED on all three providers. The
          # guard was blocking deploys that work, on a number that does not gate them.
          #
          # The credit is still read and published every run — the information was
          # never the problem, the blocking was. Set CANARY_MIN_CREDIT_USD (or the
          # dispatch input) above 0 to re-enable, if a case is ever found where the
          # authorization genuinely binds.
          floor="${MIN_CREDIT_OVERRIDE:-${CANARY_MIN_CREDIT_USD:-0}}"
          set +e
          timeout 120 uv run just-akash balance --check --min-usd "$floor" --json > credit.json 2>credit.err
          echo "balance rc=$?"
          set -e
          cat credit.json 2>/dev/null || true
          # FULL balance too — `--check` reports only granted-minus-escrow, which is
          # the DepositAuthorization headroom, NOT the account's available balance.
          echo '--- full balance ---'
          timeout 120 uv run just-akash balance --json || true
          [ -s credit.err ] && cat credit.err || true

      - name: Deploy canaries for providers missing one
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_missing || vars.CANARY_AUTODEPLOY == 'true' }}
        env:
          # Same override the read step sees. Without this the two steps compute
          # DIFFERENT floors from the same dispatch, and the one that decides whether
          # to spend is the one that cannot see the input.
          MIN_CREDIT_OVERRIDE: ${{ inputs.min_credit_usd }}
        run: |
          set -euo pipefail
          [ -s missing.txt ] || { echo "Every provider has a live canary — nothing to deploy."; exit 0; }

          # CREDIT FLOOR — the second half of sharing one wallet.
          #
          # The lock above stops the two workflows racing on the account SEQUENCE. It does
          # nothing about them sharing a BUDGET. The canary holds escrow permanently, the
          # smoke needs credit to deploy at all, and it is one pool: a canary that keeps
          # recreating leases on a flapping provider could quietly starve the smoke into
          # 402ing every morning. The existing AkashSmokeWalletCredit alerts would fire on
          # the shared number and point at nothing in particular.
          #
          # Measured 2026-08-05 from just_akash_deploy_credit_usd: $81.37 now, $154.33 a
          # week earlier — roughly $10/day already, i.e. the wallet reaches the <$20
          # warning in about six days on EXISTING usage. This is not a hypothetical.
          #
          # So the canary yields. Below the floor it declines to deploy and says so; the
          # smoke keeps the remaining budget, because "can we deploy at all" is the more
          # important question and it is the one the canary cannot answer for itself.
          # The already-running canaries are untouched — this only blocks NEW leases.
          # Read the verdict captured by the step above — one balance call per run.
          # `status` distinguishes the two outcomes an exit code cannot: LOW means the
          # wallet really is short, anything else means we could not MEASURE it. The
          # first version of this guard was `if ! balance ... >/dev/null 2>&1`, which
          # conflated them and reported a low wallet on a run where credit was $81.
          # DEFAULT 0 = DISABLED, and that is a correction, not a loosening.
          #
          # This gated on `balance --check`'s free_usd, which is grant MINUS escrow —
          # headroom under the DepositAuthorization Console issues to this API key. It
          # is not the account's available balance, and I had been reporting it as one.
          # Measured 2026-08-06: free_usd read $2.31 while the Console account held
          # $573.38, and a deploy at that moment SUCCEEDED on all three providers. The
          # guard was blocking deploys that work, on a number that does not gate them.
          #
          # The credit is still read and published every run — the information was
          # never the problem, the blocking was. Set CANARY_MIN_CREDIT_USD (or the
          # dispatch input) above 0 to re-enable, if a case is ever found where the
          # authorization genuinely binds.
          floor="${MIN_CREDIT_OVERRIDE:-${CANARY_MIN_CREDIT_USD:-0}}"
          if [ "${floor%%.*}" = "0" ]; then
            echo "credit floor disabled (floor=$floor) - not gating on credit at all."
          else
            status=$(python -c "import json,sys;print(json.load(open('credit.json')).get('status',''))" 2>/dev/null || true)
            if [ "$status" = "LOW" ]; then
              echo "::warning::deploy credit is below the \$${floor} floor - NOT creating canary leases, so the daily smoke keeps the remaining budget."
              exit 0
            fi
            if [ "$status" != "OK" ]; then
              echo "::warning::could not READ the deploy credit - NOT creating canary leases. This is a measurement failure, not a low wallet; see the Read deploy credit step above."
              exit 0
            fi
          fi
          CANARY_PY_B64=$(base64 -w0 canary/canary.py)
          # name<TAB>address, both resolved by canary/ensure.py from AKASH_PROVIDERS.
          while IFS=$'\t' read -r provider address; do
            [ -n "$provider" ] && [ -n "$address" ] || continue
            echo "::group::deploy canary on $provider ($address)"
            sed -e "s|PLACEHOLDER_CANARY_PY_B64|${CANARY_PY_B64}|" \
                -e "s|PLACEHOLDER_PROVIDER|${provider}|" \
                sdl/canary.yaml > "sdl-canary-${provider}.yaml"
            uv run just-akash deploy \
              --sdl "sdl-canary-${provider}.yaml" \
              --provider "$address" \
              --deposit "${CANARY_DEPOSIT_USD:-2.0}" \
            | tee "deploy-${provider}.log"
            dseq=$(grep -oE 'dseq[ =:]+[0-9]+' "deploy-${provider}.log" | grep -oE '[0-9]+' | head -1 || true)
            if [ -n "$dseq" ]; then
              # A LOCAL CONVENIENCE ONLY — deliberately not how the next run finds this
              # lease. `tag` writes .tags.json in the working copy, and this runner is
              # destroyed when the job ends, so the tag is gone by the next run. It once
              # WAS the matching key, which meant every run saw three missing canaries and
              # would have opened three more leases. canary/ensure.py now identifies a
              # canary by service set + lease provider, both read off the deployment.
              uv run just-akash tag --dseq "$dseq" --name "canary-${provider}" || true
              uv run just-akash auto-topup --dseq "$dseq" --on || \
                echo "::warning::auto-topup could not be enabled on ${dseq}; escrow will need watching"
            else
              echo "::warning::could not parse a dseq from the deploy output for ${provider}"
            fi
            echo "::endgroup::"
          done < missing.txt

      # BEST EFFORT, deliberately. This step only refreshes targets.json to pick up a
      # just-created lease; the copy written by the resolve step above is already usable, and
      # a provider missing its uri for one cycle costs a single sample. Failing here would
      # cost the whole collection instead — details.py goes to some trouble to exit 0 on an
      # unreadable listing precisely so the reachability reading survives, and a `set -e`
      # step wrapping it would throw that away for any OTHER failure (a `list` timeout, or
      # ensure.py exiting 2 on a rejected document).
      - name: Re-resolve targets after any deploy
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run just-akash list --json > listing.json
          uv run python -m canary.details --listing listing.json --out details.json
          uv run python -m canary.ensure \
            --details details.json --akash-providers "$AKASH_PROVIDERS" \
            --targets targets.json

      # An unreachable canary is the MEASUREMENT, so this step must not fail the run —
      # collect.py exits 0 on an outage by design. If it failed here the file would never
      # be published and we would lose the very reading we came for.
      - name: Collect from inside every deployment
        run: |
          set -euo pipefail
          cp prior/canary-state.json state.json 2>/dev/null || echo '{}' > state.json
          uv run python -m canary.collect \
            --targets targets.json --state state.json --out canary-metrics.prom \
            --credit credit.json
          echo "--- exposition ---"; cat canary-metrics.prom

      - name: Publish to the telemetry branch
        env:
          SRC_PROM: canary-metrics.prom
          SRC_STATE: state.json
          SRC_TARGETS: targets.json
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/publish-canary.sh

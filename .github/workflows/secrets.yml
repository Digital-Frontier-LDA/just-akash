name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge-queue prerequisite. `Gitleaks`, `TruffleHog` and `detect-secrets` are
  # required checks on main; a required check that does not also run on
  # `merge_group` never reports for the queued commit and the entry is ejected at
  # the status-check timeout. Concurrency needs no change: a merge group's
  # github.ref (refs/heads/gh-readonly-queue/...) is unique per group.
  merge_group:
  # The daily all-branch scan (openmix-g442m): PR, merge-group and push scans
  # cover only their own range, so a secret on a branch with no PR is found
  # here, within a day, and reported to ONE issue (the `report` job).
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# The event is part of the group: on schedule and workflow_dispatch github.ref is
# refs/heads/main too, so without it a cron would cancel an in-flight push-to-main
# run, and verify_release_source.py holds a release whose latest exact-SHA push
# run is not `success` (openmix-g442m, B4).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every scanner job: with no explicit block these inherit repo or
# org defaults, and a write-capable default would let a compromised action or a crafted
# scan target modify repository state from inside a security job.
permissions:
  contents: read

jobs:
  # Cheap, dependency-free, and first: the SOPS migration (v1.35.0) has already
  # been eroded twice by PRs that re-added a direct `secrets.X` reference, each
  # caught by hand after merge. This turns that into a gate.
  invariants:
    name: Repo invariants (SOPS-only secrets, changelog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repo invariants
        run: python3 .github/scripts/check_repo_invariants.py

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      # BEFORE the checkout: a branch pushed in between then shows up in the
      # checkout but not in the count, never the other way round.
      - name: Branch and tag counts the API lists (daily scan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        # A failed API call must fail here, not count 0. `echo "X=$(…)"` drops the
        # substitution's status even under -e, and without pipefail (the default
        # shell has none) a pipeline's status is wc's: assign first, with pipefail.
        run: |
          set -euo pipefail
          branches=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name' | wc -l)
          tags=$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --paginate --jq '.[].name' | wc -l)
          echo "API_BRANCHES=${branches}" >> "$GITHUB_ENV"
          echo "API_TAGS=${tags}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action@v2.
      # The v2 action requires a paid GITLEAKS_LICENSE for organization repos;
      # the CLI itself is free and unlicensed and scans the full history.
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      # openmix-g442m. With no --log-opts, gitleaks runs `git log -p --all`: every
      # PR scanned every branch and tag, and one abandoned branch turned every PR
      # red. Each event now scans what it adds; the daily run scans everything
      # and reports to one issue. .github/scripts/secret_scan.py says why for
      # each step.
      - name: Fetch closed-PR heads (daily scan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pull/*'
          python3 .github/scripts/secret_scan.py refs \
            --api-branches "$API_BRANCHES" --api-tags "$API_TAGS" --out refs.json

      - name: Scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/secret_scan.py range --event "$EVENT"
          --base "$BASE" --head "$HEAD" --before "$BEFORE" --sha "$SHA"

      # gitleaks reads both files from --source: a PR must not exempt its own range.
      - name: Exemptions from the base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 .github/scripts/secret_scan.py pin-config --base "$BASE"

      - name: Escape guard
        if: steps.range.outputs.rev != '--all' && steps.range.outputs.empty != 'true'
        env:
          REV: ${{ steps.range.outputs.rev }}
        run: python3 .github/scripts/secret_scan.py escape-guard --rev "$REV"

      - name: Run gitleaks (this event's range)
        if: steps.range.outputs.rev != '--all' && steps.range.outputs.empty != 'true'
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks detect --source . --redact --verbose --exit-code 1 --log-opts="$LOG_OPTS"

      # Findings never fail this step (--exit-code 0); a scanner error does, and
      # `report` fails closed on anything but a parsed report from a clean run.
      - name: Run gitleaks (every branch, tag and closed-PR head)
        if: steps.range.outputs.rev == '--all'
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: >-
          gitleaks detect --source . --redact --exit-code 0
          --report-format json --report-path gl.json --log-opts="$LOG_OPTS"

      - name: Keep the report
        if: steps.range.outputs.rev == '--all'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-all-branches
          path: |
            gl.json
            refs.json
          retention-days: 7

  # The only job that may write: it turns the daily scan into ONE issue and
  # fails closed. The run's conclusion is the heartbeat df-grafana reads (a
  # `success` here means the scan ran AND its report was parsed and filed).
  report:
    name: Report all-branch scan
    needs: gitleaks
    if: >-
      always()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: secret-scan-all-branches
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch closed-PR heads
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitleaks-all-branches

      - name: Read the report (fails closed)
        id: report
        env:
          SCAN_RESULT: ${{ needs.gitleaks.result }}
        run: >-
          python3 .github/scripts/secret_scan.py report --report gl.json --refs refs.json
          --scan-result "$SCAN_RESULT" --body-out body.md

      - name: File or close the issue
        env:
          FINDINGS: ${{ steps.report.outputs.findings }}
        run: |
          gh label create "$LABEL" --color B60205 --force \
            --description "Findings of the daily all-branch secret scan (openmix-g442m)"
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ "$FINDINGS" -gt 0 ]; then
            if [ -n "$open" ]; then
              gh issue edit "$open" --body-file body.md
            else
              gh issue create --label "$LABEL" --title "Secret Scan: findings on non-main refs" --body-file body.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "The daily all-branch scan is clean."
          fi

      - name: A finding on main fails the run
        if: steps.report.outputs.on_main != '0'
        run: |
          echo "::error::${{ steps.report.outputs.on_main }} finding(s) are reachable from main"
          exit 1

  # The plant tests (P1-P7) need the pinned gitleaks binary, which the unit-test
  # job does not install; here a missing binary is a failure, not a skip.
  secret-scan-plants:
    name: Secret Scan plant tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f gitleaks.tar.gz

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run the plant tests
        env:
          SECRET_SCAN_REQUIRE_GITLEAKS: '1'
        run: |
          pip install pytest==9.0.3 pyyaml==6.0.3
          # -o addopts= drops pyproject's --cov flags (no pytest-cov here); --noconftest
          # skips tests/conftest.py, which imports the package this job does not install.
          python3 -m pytest tests/test_secret_scan.py -q --noconftest -o addopts=

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # TWO pins are needed here.
        #
        # The SHA below pins the ACTION code (not @main — a branch ref would mean every
        # push to trufflehog's default branch changes what this security job executes,
        # with no release in between; just-akash#97).
        #
        # It does NOT pin the SCANNER. The action pulls
        # `ghcr.io/trufflesecurity/trufflehog:${version}` at runtime, so the SHA alone
        # pins only the wrapper — `version:` below decides which scanner binary runs.
        #
        # `version:` exists because 3.96.0's `Lob` detector matched ordinary identifiers
        # and its verifier confirmed every hit — a false-verification family that reads
        # as a clean scan right up until it reads as a pile of secrets. Fixed upstream
        # in v3.97.0 (trufflesecurity/trufflehog#5188). Measured 2026-09-06 on a clean
        # full-history clone of this repo (just-akash#280), --no-update, native
        # checksum-verified binaries:
        #
        #   scanner   findings   verified   Lob
        #   3.95.2          4          0     0   the old pin (the dodge)
        #   3.96.0        134        130   130   the regression, reproduced — ALL 130 verified
        #   3.97.4          4          0     0   identical to the old pin on today's corpus
        #
        # The 4 are unverified Postgres test fixtures in tests/test_transport_inject.py,
        # same set on 3.95.2 and 3.97.4. ⚠️ The table above was collected UNFILTERED
        # (no `--only-verified`): CI's extra_args add that flag, which is exactly why
        # those 4 never reach the gate — and why re-verifying a candidate must also be
        # done UNFILTERED, or "non-zero unverified" is unobservable and the criterion
        # reads as failed. Before moving `version:` again, re-run that three-version
        # table (regression / pin / candidate) without `--only-verified`: a candidate
        # must show ZERO Lob hits and non-zero unverified.
        #
        # ⚠️ NOTHING UPDATES THIS PIN: Dependabot bumps the action SHA but cannot see
        # the `version:` input string — this drifted 4.5 months unnoticed for exactly
        # that reason. #280 tracks the follow-up (a staleness check or tracked path).
        #
        # Reproducing on Apple Silicon: the ghcr arm64 image variant is mis-packaged
        # upstream (the manifest lists linux/arm64, but every binary in it — /bin/ls
        # included — fails `exec format error`). Use the native release binary from
        # the release tarball, verified against its checksums.txt, with `--no-update`.
        #
        # The two pins move INDEPENDENTLY, and that is the point. The wrapper SHA and
        # `version:` are different things and are NOT expected to match.
        #
        # ⛔ THE INVARIANT, stated instead of a snapshot: this action runs
        # `"${IMAGE}:${VERSION}"` and passes `--no-update`, so THE WRAPPER CANNOT
        # INFLUENCE WHICH SCANNER BINARY EXECUTES — `version:` alone decides that.
        # Raising `version:` to "align" it with the wrapper tag would discard the
        # verification recorded above — the last tag-aligned version was the 3.96.0
        # regression. Do not do it on a bot's suggestion.
        #
        # ⇒ RE-RUN THE CHECK ON EVERY WRAPPER BUMP rather than trusting a recorded
        # result: diff `action.yml` between the old and new pinned SHAs and confirm both
        # `"${IMAGE}:${VERSION}"` and `--no-update` survive. Naming specific SHAs here
        # goes stale by construction on the next bump; the check does not.
        # Last run 2026-09-20: 20652fbb (v3.97.1) -> 363923b9 (v3.97.4), BYTE-IDENTICAL
        # (3885 bytes both sides, sha256 c3847cdb…), both behaviours intact.
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # Pins the SCANNER BINARY. Without it the SHA above pins only the wrapper.
          version: 3.97.4
          # merge_group ONLY. The action picks its commit range from the event name and
          # knows push, pull_request, workflow_dispatch and schedule — nothing else. On
          # merge_group it matches no branch, BASE and HEAD stay empty, and it silently
          # scans the WHOLE history with live verification on every queued group. Both
          # expressions are '' on every other event, so those keep the event-based range
          # exactly as before; on merge_group they bound the scan to what the group adds
          # (base_sha is an ancestor of the fetch-depth: 0 checkout, and never equals
          # head_sha, which the action would refuse).
          base: ${{ github.event.merge_group.base_sha }}
          head: ${{ github.event.merge_group.head_sha }}
          # NO `--no-update` here: this ACTION already passes it, and repeating the
          # flag is a hard error ("flag 'no-update' cannot be repeated"). The flag is
          # still REQUIRED wherever trufflehog is invoked as a raw `docker run`, which
          # is how the sibling repos call it — there the binary self-updates past its
          # own pin and silently runs the newest release. Same defect, two different
          # call shapes, and only one of them needs the fix.
          extra_args: --only-verified

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Pinned: the escape guard's reasoning about the detect-secrets pragma (that it
      # blinds only this scanner) is about this version's matching (openmix-g442m).
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run detect-secrets
        run: |
          # SOPS files are ciphertext BY DESIGN — their high-entropy blobs are not
          # leaked secrets, and they rotate on every edit, so baselining them would
          # churn the baseline forever. Exclude the path instead.
          # secrets/registry.yaml `expected_hmac:` lines are the same case: a keyed
          # HMAC-SHA256 DIGEST (df-cicd sops-edit), not a value, recomputed on every
          # rotate/attest. Only that exact shape (key + 64 hex) is excluded; the rest
          # of the registry stays scanned, so a value pasted there is still caught.
          detect-secrets scan \
            --exclude-files '.secrets.baseline' \
            --exclude-files '.*\.sops\.(env|ya?ml|json)$' \
            --exclude-lines '^\s*expected_hmac:\s*"[0-9a-f]{64}"\s*$' > .secrets.baseline.new
          # Audit fields (is_secret / is_verified) are dropped before comparing: the
          # escape guard requires every entry a PR adds to be audited, and a fresh
          # scan never carries them (openmix-g442m, B2).
          python3 .github/scripts/secret_scan.py baseline-equal .secrets.baseline .secrets.baseline.new
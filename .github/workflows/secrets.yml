name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every scanner job: with no explicit block these inherit repo or
# org defaults, and a write-capable default would let a compromised action or a crafted
# scan target modify repository state from inside a security job.
permissions:
  contents: read

jobs:
  # Cheap, dependency-free, and first: the SOPS migration (v1.35.0) has already
  # been eroded twice by PRs that re-added a direct `secrets.X` reference, each
  # caught by hand after merge. This turns that into a gate.
  invariants:
    name: Repo invariants (SOPS-only secrets, changelog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repo invariants
        run: python3 .github/scripts/check_repo_invariants.py

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action@v2.
      # The v2 action requires a paid GITLEAKS_LICENSE for organization repos;
      # the CLI itself is free and unlicensed and scans the full history.
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # TWO pins are needed here.
        #
        # The SHA below pins the ACTION code (not @main — a branch ref would mean every
        # push to trufflehog's default branch changes what this security job executes,
        # with no release in between; just-akash#97).
        #
        # It does NOT pin the SCANNER. The action pulls
        # `ghcr.io/trufflesecurity/trufflehog:${version}` at runtime, so the SHA alone
        # pins only the wrapper — `version:` below decides which scanner binary runs.
        #
        # `version:` exists because 3.96.0's `Lob` detector matched ordinary identifiers
        # and its verifier confirmed every hit — a false-verification family that reads
        # as a clean scan right up until it reads as a pile of secrets. Fixed upstream
        # in v3.97.0 (trufflesecurity/trufflehog#5188). Measured 2026-09-06 on a clean
        # full-history clone of this repo (just-akash#280), --no-update, native
        # checksum-verified binaries:
        #
        #   scanner   findings   verified   Lob
        #   3.95.2          4          0     0   the old pin (the dodge)
        #   3.96.0        134        130   130   the regression, reproduced — ALL 130 verified
        #   3.97.4          4          0     0   identical to the old pin on today's corpus
        #
        # The 4 are unverified Postgres test fixtures in tests/test_transport_inject.py,
        # same set on 3.95.2 and 3.97.4. ⚠️ The table above was collected UNFILTERED
        # (no `--only-verified`): CI's extra_args add that flag, which is exactly why
        # those 4 never reach the gate — and why re-verifying a candidate must also be
        # done UNFILTERED, or "non-zero unverified" is unobservable and the criterion
        # reads as failed. Before moving `version:` again, re-run that three-version
        # table (regression / pin / candidate) without `--only-verified`: a candidate
        # must show ZERO Lob hits and non-zero unverified.
        #
        # ⚠️ NOTHING UPDATES THIS PIN: Dependabot bumps the action SHA but cannot see
        # the `version:` input string — this drifted 4.5 months unnoticed for exactly
        # that reason. #280 tracks the follow-up (a staleness check or tracked path).
        #
        # Reproducing on Apple Silicon: the ghcr arm64 image variant is mis-packaged
        # upstream (the manifest lists linux/arm64, but every binary in it — /bin/ls
        # included — fails `exec format error`). Use the native release binary from
        # the release tarball, verified against its checksums.txt, with `--no-update`.
        #
        # The two pins move INDEPENDENTLY, and that is the point. The wrapper SHA and
        # `version:` are different things and are NOT expected to match.
        #
        # ⛔ THE INVARIANT, stated instead of a snapshot: this action runs
        # `"${IMAGE}:${VERSION}"` and passes `--no-update`, so THE WRAPPER CANNOT
        # INFLUENCE WHICH SCANNER BINARY EXECUTES — `version:` alone decides that.
        # Raising `version:` to "align" it with the wrapper tag would discard the
        # verification recorded above — the last tag-aligned version was the 3.96.0
        # regression. Do not do it on a bot's suggestion.
        #
        # ⇒ RE-RUN THE CHECK ON EVERY WRAPPER BUMP rather than trusting a recorded
        # result: diff `action.yml` between the old and new pinned SHAs and confirm both
        # `"${IMAGE}:${VERSION}"` and `--no-update` survive. Naming specific SHAs here
        # goes stale by construction on the next bump; the check does not.
        # Last run 2026-08-24: 6f3c981 (v3.96.0) -> bcfcf73 (v3.97.0), BYTE-IDENTICAL
        # (3885 bytes both sides), both behaviours intact.
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          # Pins the SCANNER BINARY. Without it the SHA above pins only the wrapper.
          version: 3.97.4
          # NO `--no-update` here: this ACTION already passes it, and repeating the
          # flag is a hard error ("flag 'no-update' cannot be repeated"). The flag is
          # still REQUIRED wherever trufflehog is invoked as a raw `docker run`, which
          # is how the sibling repos call it — there the binary self-updates past its
          # own pin and silently runs the newest release. Same defect, two different
          # call shapes, and only one of them needs the fix.
          extra_args: --only-verified

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          # SOPS files are ciphertext BY DESIGN — their high-entropy blobs are not
          # leaked secrets, and they rotate on every edit, so baselining them would
          # churn the baseline forever. Exclude the path instead.
          detect-secrets scan \
            --exclude-files '.secrets.baseline' \
            --exclude-files '.*\.sops\.(env|ya?ml|json)$' > .secrets.baseline.new
          python3 -c "
          import json, sys
          with open('.secrets.baseline') as f: old = json.load(f)
          with open('.secrets.baseline.new') as f: new = json.load(f)
          old_results = json.dumps(old.get('results', {}), sort_keys=True)
          new_results = json.dumps(new.get('results', {}), sort_keys=True)
          if old_results != new_results:
            print('::error::detect-secrets found new secrets. Update .secrets.baseline')
            sys.exit(1)
          print('No new secrets detected')
          "
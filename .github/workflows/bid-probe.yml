name: Bid probe

# Does each of OUR providers still bid, on every order shape we sell?
#
# Submits a real, provider-pinned order per (provider, scenario), waits for our
# bid, and closes the order without ever leasing. This is the outside-in
# replacement for the autobidder's in-cluster synthetic probe; see
# just_akash/bid_probe.py for why each property is the way it is.
#
# STAGE 4: scheduled every 3h, MEASURING. Stage 1's dispatches proved the
# pinning works and leaked zero orders (4 runs, 9/9 pairs bid, reaper clean), so
# the schedule is on — but nothing pages from it yet. The per-cluster alert rules
# exist and ship PAUSED, and the in-cluster synthetic probe is still the primary
# bid-health signal until the two have been compared for weeks.
#
# WHY 3h, AND WHAT IT COSTS. It matches the in-cluster probe's cadence, but the
# tail does not: GitHub's cron is best-effort, and this repo's own history shows
# 69-92% delivery with 24-211 minutes of skew (a 3h31m delay on 2026-08-03 alone
# exceeded a full interval). Expected MTTD is therefore ~2.2h median but ~9.5h
# worst case, against ~1.6h/3.1h for the in-cluster probe. That regression is
# accepted deliberately; bidprobe-stale is what keeps a MISSED run visible
# rather than silent. Measure before trusting: bidprobe-runs.jsonl on the
# telemetry branch records every run's scheduled-vs-actual so delivery and skew
# are computed from data, not assumed.
#
# 9 pairs/run x 8 runs/day = 72 orders/day, ~$36/day of escrow CHURN (each
# deposit returns on close) against a grant that has been fully locked once
# before. The other cost is wall-clock in the shared akash-wallet concurrency
# group; the first fleet run measured 3m23s.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3h. Revert = comment this line out.
  workflow_dispatch:
    inputs:
      cluster:
        description: "Limit to one cluster"
        type: choice
        default: all
        # "all" rather than an empty string: actionlint rejects an empty option
        # value, and the workflow would not render in the UI at all.
        options: [all, alphavps, onidc, hetzner_hel]
      retry_delay:
        description: "Seconds before confirming a NO-BID (0 disables the retry)"
        type: string
        default: "60"

# ⚠️ SHARED WITH provider-smoke.yml, provider-canary.yml, cleanup-stale.yml and
# auto-topup-audit.yml, and that is REQUIRED, not incidental: every one of them
# spends from the same Console wallet, which is a single Cosmos account. Two
# concurrent deploys share a sequence number and one fails with an
# account-sequence mismatch — and just-akash has no sequence-contention retry.
# Renaming this group silently un-serialises them.
#
# The cost is real and must be measured before this workflow is ever scheduled:
# GitHub keeps at most ONE pending run per group, so a third arrival while one
# runs and one waits DISCARDS the waiting run. At 8 runs/day this workflow
# becomes the group's heaviest user.
concurrency:
  group: akash-wallet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Probe provider bid health
    runs-on: ubuntu-latest
    # Backstop only. The real bound is the step timeout below: a JOB timeout
    # cancels the whole job and the always()-reap step would never run, leaking
    # every open order this run created.
    timeout-minutes: 45
    steps:
      # FIRST step, before anything slow, so this is as close to "when the run
      # actually began" as the runner can report. It exists because
      # `github.run_started_at` is NOT a real property of the github context —
      # referencing it yields an empty string, which would have silently written
      # no run lines at all and left Stage 4 measuring nothing while looking
      # like it worked.
      # Written to RUNNER_TEMP, not the workspace: actions/checkout cleans the
      # workspace, which would delete this before it could be uploaded.
      - name: Record run start
        run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/bidprobe-run-started"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Move it into the workspace now that checkout has finished cleaning.
      # Every uploaded path must share one root: upload-artifact resolves the
      # least common ancestor, so mixing RUNNER_TEMP and the workspace would
      # silently re-root the whole artifact and break the accrue job's paths.
      - name: Restore run-start marker
        run: mv "$RUNNER_TEMP/bidprobe-run-started" "$GITHUB_WORKSPACE/"

      # Retried: a transient "operation was aborted due to timeout" here on
      # 2026-08-17 lost the whole 15:07 slot, which at a 3h cadence put the
      # gap between results at ~6h and paged bidprobe-stale. Losing a slot to
      # a flaky action download is not worth a critical page.
      - name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
        continue-on-error: true

      - name: Set up uv (retry)
        if: steps.uv.outcome == 'failure'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Load SOPS secrets
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      # Worst case is every pair no-bidding AND being retried:
      # 9 x (45s wait + 60s confirm delay + 45s retry wait) = 1350s = 22.5 min,
      # plus order create/close overhead. 25m would clip that, so 35m — still
      # well inside the 45m job backstop so the always()-reap step always runs.
      - name: Run bid probe
        timeout-minutes: 35
        env:
          BIDPROBE_PROM: ${{ github.workspace }}/bidprobe-metrics.prom
          BIDPROBE_JSONL: ${{ github.workspace }}/bidprobe.jsonl
          # Dispatch inputs reach the shell as ENV, never as ${{ }} interpolated
          # into the script body: GitHub substitutes those before bash parses,
          # so a crafted input would be executed as source, not read as data.
          CLUSTER_INPUT: ${{ inputs.cluster }}
          RETRY_DELAY_INPUT: ${{ inputs.retry_delay }}
        run: |
          set -euo pipefail
          # Normalise FIRST. On a scheduled run there are no inputs at all, so
          # both arrive as empty strings; using ${VAR:-default} only at the point
          # of validation while passing the raw VAR to the CLI would hand argparse
          # `--retry-delay ""` and fail every cron run.
          CLUSTER="${CLUSTER_INPUT:-all}"
          RETRY="${RETRY_DELAY_INPUT:-60}"

          args=()
          if [[ "$CLUSTER" != "all" ]]; then
            args+=(--cluster "$CLUSTER")
          fi
          # Reject anything that is not a plain integer rather than passing it on.
          if [[ ! "$RETRY" =~ ^[0-9]+$ ]]; then
            echo "retry_delay must be a non-negative integer, got: $RETRY" >&2
            exit 2
          fi
          uv run python -m just_akash.bid_probe \
            "${args[@]}" \
            --retry-delay "$RETRY" \
            --prom-out "$BIDPROBE_PROM" \
            --jsonl-out "$BIDPROBE_JSONL"

      - name: Upload bid-probe telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bidprobe-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/bidprobe-metrics.prom
            ${{ github.workspace }}/bidprobe.jsonl
            ${{ github.workspace }}/bidprobe-run-started
          if-no-files-found: ignore
          retention-days: 90

      # Reap INSIDE this run, not from a separate scheduled workflow. A separate
      # workflow would queue on the same akash-wallet group and can be discarded
      # outright when two runs are already ahead of it — so the escrow reaper
      # would be the first thing dropped exactly when the group is busiest. Here
      # it inherits this run's already-granted slot and cannot be superseded.
      #
      # --only-service probe is load-bearing: it confines the reaper to the
      # short-lived class this workflow creates. The 48h `backtest` class can be
      # a live e2e run, and an unattended reaper must never be licensed to close
      # something it does not understand.
      # `if: always()` means this runs even when setup failed — in which case
      # `uv` does not exist and the step exited 127, reddening a run that had
      # created nothing to reap. Skip cleanly instead: no uv means no probe ran.
      - name: Reap leaked probe orders
        if: always()
        timeout-minutes: 10
        run: |
          command -v uv >/dev/null || { echo "uv absent — setup failed, so no orders were created"; exit 0; }
          uv run python -m just_akash.cleanup_stale --only-service probe --execute

  # Publish to the telemetry branch from a separate job, so the privileged
  # contents:write token never runs alongside the code holding the API key.
  accrue:
    name: Publish bid-probe telemetry
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # a crashed probe job may have produced no artifact
        with:
          name: bidprobe-${{ github.run_id }}
          path: dl
      - name: Append to telemetry branch
        env:
          PROM_SRC: dl/bidprobe-metrics.prom
          JSONL_SRC: dl/bidprobe.jsonl
          RUN_ID: ${{ github.run_id }}
          # Delivery instrumentation. Stage 4's whole purpose is to MEASURE
          # whether a GitHub cron is fit to be the fleet's only bid-health
          # trigger, and the Actions API ages runs out — so scheduled-vs-actual
          # is recorded in the telemetry branch, where it accumulates for as
          # long as the branch exists.
          RUN_EVENT: ${{ github.event_name }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
          RUN_STARTED_FILE: dl/bidprobe-run-started
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash .github/scripts/accrue-bidprobe.sh

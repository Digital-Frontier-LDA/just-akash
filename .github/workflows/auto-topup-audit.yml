# Answer one question, cheaply and without spending anything: is auto top-up ACTUALLY on
# for the deployments we believe it is on for?
#
# It matters because "Auto top-up enabled for deployment ..." was printed for all three
# canaries on 2026-08-08 and all three had expired 13-15h later on a $2.00 escrow deposit
# (lease_replacements_total reached 3 per provider before anyone attributed it correctly).
# set_auto_top_up now verifies its own write, but that only covers deployments created
# AFTER it merged -- this reads the live ones, which is the evidence that decides whether
# the flag fails to persist at all, or persists and is simply not sufficient on its own
# (estimatedTopUpAmount and topUpFrequencyMs are never set by any code path).
#
# STRICTLY READ-ONLY. `auto-topup --dseq X` with neither --on nor --off takes the show
# branch, and nothing here creates, funds, or closes a deployment.
name: Auto top-up audit

on:
  workflow_dispatch:

# Same wallet as the canary and the smoke. Queue rather than race, and never cancel a
# run that might be mid-deploy in a sibling workflow.
concurrency:
  group: akash-wallet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Read auto top-up state for every live deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TRUSTED REF ONLY, and this runs BEFORE checkout on purpose. workflow_dispatch
      # lets the operator pick any branch or tag, and checkout then executes code from it
      # -- including ./.github/actions/sops-env and just_akash/api.py, both of which handle
      # SOPS_AGE_KEY and AKASH_API_KEY. A pushed branch could rewrite either and dispatch
      # this workflow to read the wallet key out. Nothing about auditing escrow needs a
      # non-default ref, so the capability is removed rather than trusted. Raised by
      # CodeRabbit on #141.
      - name: Refuse to run from a non-default ref
        env:
          # github.ref, NOT github.ref_name: branches and tags share ref_name, so a TAG
          # named after the default branch would pass a ref_name check and then have its
          # code checked out with wallet secrets in scope. Comparing the full ref makes
          # refs/tags/main fail. Raised by CodeRabbit on #141.
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/$DEFAULT" ]; then
            echo "::error::This workflow loads wallet secrets and may only run from refs/heads/$DEFAULT (got '$REF')."
            exit 1
          fi
          echo "ref=$REF is the default branch"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Matches security.yml / runner-pool.yml / runner-teardown.yml. Nothing after
          # checkout needs the GitHub token, and this workflow holds wallet credentials.
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Load SOPS secrets
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      # WHAT THE DEPOSIT BECAME, not what we asked for. On 2026-08-11 the canary
      # workflow logged "escrow deposit: 6.0 USD" for every deploy while the wallet held
      # $6.00 locked across THREE deployments -- $2.00 each. The requested deposit was not
      # what got locked, and hetzner_hel lived 12.7h on "$6.00", indistinguishable from the
      # 12.5h it lived on $2.00. The log line was taken as the outcome; it was only the
      # request. This reads escrow_account.state.funds back per deployment so the two are
      # never confused again.
      - name: Read the escrow ACTUALLY locked per deployment
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from just_akash.api import AkashConsoleAPI, escrow_locked
          import os, pathlib
          r = escrow_locked(AkashConsoleAPI(os.environ["AKASH_API_KEY"]))
          lines = ["### Escrow actually locked", "", "| dseq | escrow (uact) | escrow (ACT) |", "| --- | --- | --- |"]
          for row in r["by_deployment"]:
              act = row["escrow_uact"] / 1_000_000
              print(f"  {row['dseq']}: {row['escrow_uact']} uact = {act:.2f} ACT")
              lines.append(f"| `{row['dseq']}` | {row['escrow_uact']} | {act:.2f} |")
          tot = r["locked_uact"] / 1_000_000
          print(f"  TOTAL {tot:.2f} ACT across {r['deployments']} tallied, {r['unreadable']} unreadable, {r['skipped_no_dseq']} unnameable")
          lines += ["", f"**Total** {tot:.2f} ACT across {r['deployments']} deployment(s)."]
          omitted = r["unreadable"] + r["skipped_no_dseq"]
          if omitted:
              # A skipped deployment makes the sum a LOWER BOUND. Saying so is the whole
              # point of this audit; a quiet subtotal reads as a complete one.
              print(f"::warning::{omitted} deployment(s) omitted ({r['unreadable']} unreadable, {r['skipped_no_dseq']} with no extractable dseq) - the total above is a LOWER BOUND, not a measurement.")
              lines.append(f"> :warning: {omitted} omitted ({r['unreadable']} unreadable, {r['skipped_no_dseq']} unnameable) - total is a lower bound.")
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a").write("\n".join(lines) + "\n")
          PY

      - name: Read auto top-up for every live deployment
        run: |
          set -euo pipefail
          uv run just-akash list --json > listing.json
          python3 - <<'PY'
          import json, pathlib
          d = json.load(open("listing.json"))
          rows = d if isinstance(d, list) else (d.get("data") or d.get("deployments") or [])
          good, unknown = [], 0
          for r in rows:
              v = None
              for k in ("dseq", "id", "deploymentId"):
                  v = r.get(k) if isinstance(r, dict) else None
                  if isinstance(v, dict):
                      v = v.get("dseq")
                  if v:
                      break
              # format_deployments_json emits "?" when _extract_dseq fails (api.py:763).
              # Passing that through would call `auto-topup --dseq "?"` and print a
              # confident-looking error row for a deployment we simply could not name.
              # Dropping it SILENTLY would be worse -- an unidentifiable deployment is
              # exactly the kind of gap this audit exists to surface -- so it is counted.
              if v and str(v).isdigit():
                  good.append(str(v))
              else:
                  unknown += 1
          pathlib.Path("dseqs.txt").write_text("\n".join(good) + ("\n" if good else ""))
          pathlib.Path("unknown.txt").write_text(str(unknown))
          PY
          unknown=$(cat unknown.txt)
          echo "live deployments with a usable dseq: $(wc -l < dseqs.txt), unidentifiable: ${unknown}"
          if [ "${unknown}" -gt 0 ]; then
            echo "::warning::${unknown} live deployment(s) had no extractable dseq and could not be audited. Their auto top-up state is UNKNOWN, not verified."
          fi
          {
            echo "### Auto top-up state"
            echo ""
            echo "| dseq | reported state |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${unknown}" -gt 0 ]; then
            echo "| _(${unknown} with no extractable dseq)_ | **UNKNOWN — not audited** |" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A read failure for ONE deployment must not hide the others: this audit exists
          # because a missing answer was mistaken for a good one.
          while read -r dseq; do
            [ -n "$dseq" ] || continue
            out=$(uv run just-akash auto-topup --dseq "$dseq" 2>&1) || out="ERROR: $out"
            echo "$out"
            echo "| \`${dseq}\` | ${out//$'\n'/ } |" >> "$GITHUB_STEP_SUMMARY"
          done < dseqs.txt

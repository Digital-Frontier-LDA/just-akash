name: Cleanup stale deployments

# On-demand escrow reaper: closes leaked TEST deployments (smoke probes older
# than 1h, e2e `backtest` workloads older than 48h) on the CI Console account.
# Every active deployment holds its deposit in escrow against the deploy-credit
# grant; leaks starve the account until deploys 402 (2026-07-21: ~$191 of $246
# locked, e2e red for hours). The daily smoke's sweep only reaps `probe`-service
# deployments — this catches the rest. Classification is conservative: anything
# not positively identified as test residue is left alone and listed in the log.
#
# Dry-run by default. Dispatch once with execute=false, review the verdict
# table in the log, then dispatch again with execute=true.

on:
  # ⭐ SCHEDULED since 2026-08-23 — a manual backstop is no backstop. The close plane
  # was entirely dispatch-only when 13 just-akash-runner leases held 65 ACT for 23.5h;
  # this workflow existed, was correct, and never ran. The cron observes ONLY (the
  # workflow is dry-run by default; a scheduled run has no inputs and inherits
  # execute=false), so the dispatch-once-execute=true promotion protocol is unchanged —
  # the schedule adds eyes, not hands. Minute 23: bid-probe fires at 0 */3, canary at
  # 5,35 — a third cron on :00 would stack API burst against the 5000/hr core budget
  # that has already blinded this ecosystem's provisioners.
  schedule:
    - cron: "23 0,6,12,18 * * *"  # every 6h at :23 — bounds a standing bleed at one interval
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually close the stale deployments (false = dry-run report)"
        type: boolean
        default: false

permissions:
  contents: read

# Never overlap with a live smoke run: the smoke holds young probes that the
# age floors already spare, but serializing removes even the theoretical race.
#
# ⚠️ GROUP RENAMED provider-smoke -> akash-wallet. The smoke moved to that shared
# group when provider-canary.yml was added, because all three spend from ONE
# Console-API wallet — a single Cosmos account, whose sequence number cannot carry
# two transactions at once. This file was left behind on the old name, which
# silently un-serialised the one workflow here that DESTROYS deployments from the
# two that create them. A stale group name fails open and says nothing.
concurrency:
  group: akash-wallet
  cancel-in-progress: false

jobs:
  cleanup:
    name: ${{ inputs.execute && 'Close stale deployments' || 'Dry-run stale report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      # Secrets live in secrets/ci.sops.env since #89 — this exports AKASH_API_KEY
      # (and friends) into $GITHUB_ENV; SOPS_AGE_KEY is the only GitHub secret.
      - name: Load SOPS secrets
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Inventory / cleanup
        run: uv run python -m just_akash.cleanup_stale ${{ inputs.execute && '--execute' || '' }}

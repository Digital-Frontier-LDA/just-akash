name: Cleanup stale deployments

# On-demand escrow reaper: closes leaked TEST deployments (smoke probes older
# than 1h, e2e `backtest` workloads older than 48h) on the CI Console account.
# Every active deployment holds its deposit in escrow against the deploy-credit
# grant; leaks starve the account until deploys 402 (2026-07-21: ~$191 of $246
# locked, e2e red for hours). The daily smoke's sweep only reaps `probe`-service
# deployments — this catches the rest. Classification is conservative: anything
# not positively identified as test residue is left alone and listed in the log.
#
# Dry-run by default. Dispatch once with execute=false, review the verdict
# table in the log, then dispatch again with execute=true.

on:
  # ⭐ SCHEDULED since 2026-08-23 — a manual backstop is no backstop. The close plane
  # was entirely dispatch-only when 13 just-akash-runner leases held 65 ACT for 23.5h;
  # this workflow existed, was correct, and never ran. The cron observes ONLY (the
  # workflow is dry-run by default; a scheduled run has no inputs and inherits
  # execute=false), so the dispatch-once-execute=true promotion protocol is unchanged —
  # the schedule adds eyes, not hands. Minute 23: bid-probe fires at 0 */3, canary at
  # 5,35 — a third cron on :00 would stack API burst against the 5000/hr core budget
  # that has already blinded this ecosystem's provisioners.
  schedule:
    - cron: "23 0,6,12,18 * * *"  # every 6h at :23 — bounds a standing bleed at one interval
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually close the stale deployments (false = dry-run report)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # ⛔ OFF. THE ONE-LINE PROMOTION (#250).
  #
  # "false" keeps scheduled runs reporting only, exactly as today. "true"
  # promotes them to close, with the rails in cleanup_stale.py binding: a cap
  # per wallet per run (oldest first), a refusal on any verdict the reaper does
  # not recognise, and a refusal if an implausible share of the account looks
  # closable. Every rail exits non-zero and says why.
  #
  # WHAT TO CHECK BEFORE FLIPPING IT, so this is a decision and not a shrug:
  #   1. A dispatch with execute=true has been run recently and its verdict
  #      table reviewed. The protocol is proven — 2026-08-30 closed 20, failed
  #      0 — so this is confirming it still holds, not discovering it.
  #   2. `stale (closable)` is in its normal range. The observed band across 56
  #      scheduled runs is 0-55; a number far outside it wants explaining
  #      before it is acted on automatically.
  #   3. If AKASH_API_KEYS is set, the report names every wallet it audited.
  #      "Console wallets configured: N" is printed before any of them.
  #
  # Deliberately a workflow-level constant rather than an input: an input can be
  # set per-dispatch by anyone with Actions access, and the point of the gate is
  # that promoting the SCHEDULE is a durable, reviewable change to a file.
  CLEANUP_AUTO_EXECUTE: "false"

# Never overlap with a live smoke run: the smoke holds young probes that the
# age floors already spare, but serializing removes even the theoretical race.
#
# ⚠️ GROUP RENAMED provider-smoke -> akash-wallet. The smoke moved to that shared
# group when provider-canary.yml was added, because all three spend from ONE
# Console-API wallet — a single Cosmos account, whose sequence number cannot carry
# two transactions at once. This file was left behind on the old name, which
# silently un-serialised the one workflow here that DESTROYS deployments from the
# two that create them. A stale group name fails open and says nothing.
concurrency:
  group: akash-wallet
  cancel-in-progress: false

jobs:
  cleanup:
    # ⛔ MODE-NEUTRAL ON PURPOSE. This used to read
    #   ${{ inputs.execute && 'Close stale deployments' || 'Dry-run stale report' }}
    # which was correct for dispatches and WRONG for a promoted schedule: a
    # scheduled run supplies no inputs, so `inputs.execute` is empty and the job
    # would be labelled "Dry-run stale report" while CLEANUP_AUTO_EXECUTE had it
    # closing deployments. A run that closed 55 leases under a label saying it
    # closed nothing is the exact defect #250 is about, reproduced in the audit
    # trail of the fix for it.
    #
    # The `env` context is not available in a job name, so the honest option is
    # a label that CANNOT misdescribe the run. The effective mode is written to
    # the step summary below, where both variables are readable.
    name: Stale deployment sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      # Secrets live in secrets/ci.sops.env since #89 — this exports AKASH_API_KEY
      # (and friends) into $GITHUB_ENV; SOPS_AGE_KEY is the only GitHub secret.
      - name: Load SOPS secrets
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Inventory / cleanup
        # ⛔ `--reap-runners` IS PASSED UNCONDITIONALLY, AND WITHOUT IT THIS WORKFLOW CANNOT
        # REACH THE POPULATION IT EXISTS FOR. `classify()` returns LEAVE-real-or-unknown for
        # EVERY `services == ['runner']` deployment when the flag is off (cleanup_stale.py:112),
        # so the runner leases this repo creates were invisible to it regardless of --execute.
        # MEASURED on the 12:35Z scheduled run of 2026-08-25: 30 active deployments, 22 of them
        # `just-akash-runner` leases holding 110 ACT, verdict `stale (closable): 0`. Promoting
        # that run to --execute would have closed NOTHING. The schedule was never the only
        # thing missing, and fixing only the schedule would have looked like a fix.
        #
        # ⚠ Safe unconditionally because it only OPENS the runner branch, which then proves
        # ownership itself: group_spec.name must carry PLACEMENT_PREFIX (LEAVE-not-ours
        # otherwise), an unreadable listing refuses (LEAVE-unverified-runner), and a 6h age
        # floor applies. Scheduled runs still inherit execute=false, so this changes what the
        # cron REPORTS, not what it closes. Promotion to --execute stays a human decision and
        # the 200GiB-volume protocol is unchanged.
        # ⚠ NO `${{ }}` INTERPOLATION IN THE RUN BODY. The value is a typed boolean and so
        # cannot carry attacker text, but the pattern is the one that DOES when the input is a
        # string, and a scanner cannot tell the two apart from the call site. Passing it through
        # `env:` and branching in shell removes the class rather than arguing about this instance.
        env:
          EXECUTE: ${{ inputs.execute }}
          AUTO_EXECUTE: ${{ env.CLEANUP_AUTO_EXECUTE }}
        run: |
          # ⛔ EQUALITY AGAINST "true", NEVER A PRESENCE TEST. A scheduled run supplies no
          # inputs, so EXECUTE is empty; a dry-run dispatch sets it to the STRING "false".
          # `${EXECUTE:+--execute}` or `[ -n "$EXECUTE" ]` would both fire on "false" and turn
          # every dry run into a live close — the same defect as DRY_RUN=1 parsing as false
          # (Blazing-Back #1581) with the sign flipped.
          # AUTO_EXECUTE gets the SAME equality-against-"true" treatment, and for
          # the same reason: it is a workflow-level string, so a presence test
          # would fire on the literal "false" and silently promote every
          # scheduled run to a live close. One careful comparison here is worth
          # more than any amount of care elsewhere in this file.
          if [ "$EXECUTE" = "true" ] || [ "$AUTO_EXECUTE" = "true" ]; then
            # Record the mode where it cannot be inferred wrongly later. The job
            # label is deliberately neutral, so this is the audit trail's answer
            # to "did this run close anything, and why was it allowed to?".
            {
              echo "### Stale sweep: **CLOSING** (live)"
              echo ""
              echo "- \`execute\` input: \`${EXECUTE:-<unset>}\`"
              echo "- \`CLEANUP_AUTO_EXECUTE\`: \`${AUTO_EXECUTE:-<unset>}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            uv run python -m just_akash.cleanup_stale --reap-runners --execute
          else
            {
              echo "### Stale sweep: dry run (reported only, closed nothing)"
              echo ""
              echo "- \`execute\` input: \`${EXECUTE:-<unset>}\`"
              echo "- \`CLEANUP_AUTO_EXECUTE\`: \`${AUTO_EXECUTE:-<unset>}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            uv run python -m just_akash.cleanup_stale --reap-runners
          fi

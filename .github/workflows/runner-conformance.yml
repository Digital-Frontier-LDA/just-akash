# Akash runner CI conformance — dogfoods the DF-CICD reusable conformance check
# against this repo's own runner-pool.yml (the canonical reusable that every
# downstream consumer `uses:`). Pinned to v2.7.1 (immutable).
#
# Self-test: if the canonical pool workflow doesn't satisfy the contract, the
# conformance check fails on this repo's own PRs — exactly the failure mode
# the standard exists to prevent propagating downstream.
name: Runner Conformance

on:
  pull_request:

permissions:
  contents: read

jobs:
  pool:
    name: runner-pool
    uses: Digital-Frontier-LDA/akash-github-runner/.github/workflows/reusable-akash-runner-conformance.yml@297ea3cc41cd1d104d180c7022e12e5c25d870b4 # akash-github-runner main 2026-08-25
    with:
      workflow: .github/workflows/runner-pool.yml
      # The DIRECTORY-SCOPED rules -- backstop existence, reaper cadence,
      # producer coverage -- are gated behind this input and are the
      # registration-LEAK rules. Omitting it runs a subset and reads green.
      workflows-dir: .github/workflows
      # REQUIRED, no default: the revision of the CHECKER to run.
      # Pinned to the SAME sha as the @pin above so checker and contract cannot drift.
      checker-ref: 297ea3cc41cd1d104d180c7022e12e5c25d870b4
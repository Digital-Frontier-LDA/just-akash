# Akash runner CI conformance — dogfoods the DF-CICD reusable conformance check
# against this repo's own runner-pool.yml (the canonical reusable that every
# downstream consumer `uses:`). Pinned to an immutable SHA — NOT a tag: this header
# claimed "Pinned to v2.7.1" and akash-github-runner publishes NO TAGS AT ALL, so the
# version named here never existed. The `uses:` and `checker-ref` below carry the pin.
#
# Self-test: if the canonical pool workflow doesn't satisfy the contract, the
# conformance check fails on this repo's own PRs — exactly the failure mode
# the standard exists to prevent propagating downstream.
name: Runner Conformance

on:
  pull_request:

permissions:
  contents: read

jobs:
  pool:
    name: runner-pool
    uses: Digital-Frontier-LDA/akash-github-runner/.github/workflows/reusable-akash-runner-conformance.yml@a49af7142c97e7c4aab190bc0590cccbb843b4bc # akash-github-runner main @ a49af714 (carries #19 substring fix, #20 lease-spender,
      # #21 gate-not-re-derived, #23 target-kind selection, and #25 — the dereg backstop's
      # over-restrictive safe selector, which this repo was running without)
    with:
      workflow: .github/workflows/runner-pool.yml
      # The DIRECTORY-SCOPED rules -- backstop existence, reaper cadence,
      # producer coverage -- are gated behind this input and are the
      # registration-LEAK rules. Omitting it runs a subset and reads green.
      workflows-dir: .github/workflows
      # REQUIRED, no default: the revision of the CHECKER to run.
      # Pinned to the SAME sha as the @pin above so checker and contract cannot drift.
      # pragma: allowlist secret -- this is a PUBLIC git commit SHA on
      # akash-github-runner, not a credential. detect-secrets classifies any
      # 40-char hex value as a Hex High Entropy String, so every pin bump would
      # otherwise add a fresh baseline entry that must be regenerated by hand.
      # Allowlisting the LINE keeps the check honest across bumps; baselining the
      # VALUE would not, because the value changes on every bump by design.
      checker-ref: a49af7142c97e7c4aab190bc0590cccbb843b4bc  # pragma: allowlist secret
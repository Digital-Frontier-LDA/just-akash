# Close an ephemeral runner lease, and de-register what it left behind.
#
#   jobs:
#     teardown:
#       needs: [pool, work]
#       if: always() && needs.pool.outputs.dseq != ''
#       uses: Digital-Frontier-LDA/just-akash/.github/workflows/runner-teardown.yml@runner-v1
#       with:
#         dseq:           ${{ needs.pool.outputs.dseq }}
#         tag-prefix:     ci-myrepo
#         runner-label:   fast-pool-${{ github.run_id }}
#         github-org:     my-org
#         wallet-address: ${{ needs.pool.outputs.wallet_address }}   # optional audit data
#       secrets:
#         AKASH_API_KEY:  ${{ secrets.AKASH_API_KEY }}
#         AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}              # only with a pool
#         GH_RUNNER_PAT:  ${{ secrets.GH_RUNNER_PAT }}
#
# `if: always()` is the whole point — a teardown that only runs on success leaves the
# lease open on exactly the runs that failed, which are the ones most likely to have
# left a broken pod burning escrow.
#
# ── TWO THINGS LEAK, NOT ONE ────────────────────────────────────────────────────
# 1. The LEASE holds escrow against the same grant the next run spends from, so a leak
#    makes the next run's funding failure look like a market outage.
# 2. The RUNNER REGISTRATION persists in the org even after the pod dies. Offline
#    registrations once overflowed the first page of the org's runner listing and broke
#    provisioning for every repo in the org. EPHEMERAL=true removes a runner that RAN a
#    job; it does nothing for one that registered and was never used.
#
# ── WHY IT VERIFIES INSTEAD OF TRUSTING THE EXIT CODE ───────────────────────────
# "Deployment closed" on stderr with a non-zero exit is a SUCCESS, and a zero exit is
# not proof the lease is gone. This reads the deployment's state back and reports
# `closed` on that, because a teardown that reports success it did not achieve is how
# leases accumulate silently for weeks.
name: Akash runner teardown

on:
  workflow_call:
    inputs:
      dseq:
        description: 'Deployment to close. Empty is a no-op, not an error.'
        required: false
        type: string
        default: ''
      tag-prefix:
        description: >-
          REQUIRED. Asserted against the deployment's own tag before anything is
          destroyed. A sweep once destroyed 14 third-party deployments; this is the
          check that makes a wrong dseq a refusal instead of a loss.
        required: true
        type: string
      runner-label:
        description: 'Label whose offline registrations should be de-registered.'
        required: false
        type: string
        default: ''
      github-org:
        required: false
        type: string
        default: ''
      wallet-address:
        description: >-
          Deprecated compatibility/audit input. just-akash now locates the DSEQ owner by
          positive read-back across the configured wallet pool before destroying it.
        required: false
        type: string
        default: ''
    secrets:
      AKASH_API_KEY:
        required: false
      AKASH_API_KEYS:
        required: false
        description: >-
          Console wallet pool. just-akash probes the DSEQ under each distinct key and
          destroys only through the account that positively reads ownership. Key order
          no longer has lifecycle meaning.
      GH_RUNNER_PAT:
        required: false
    outputs:
      closed:
        description: "'true' only when the lease was READ BACK as closed."
        value: ${{ jobs.teardown.outputs.closed }}
      deregistered:
        description: 'Offline runner registrations removed.'
        value: ${{ jobs.teardown.outputs.deregistered }}
      deregister_failed:
        description: >-
          Registrations that could NOT be removed, or `unmeasured` when the listing
          itself was unreadable — which is NOT the same as zero, and must never be
          reported as a clean sweep.

          Non-zero is a compounding leak rather than a cosmetic one: each survivor
          stays in the org listing that every pool's poll pages through, so it raises
          the request cost of every later run and makes the next throttle likelier.
        value: ${{ jobs.teardown.outputs.deregister_failed }}

permissions:
  contents: read

jobs:
  teardown:
    name: Close lease and de-register runners
    runs-on: ubuntu-latest
    outputs:
      closed: ${{ steps.close.outputs.closed }}
      deregistered: ${{ steps.dereg.outputs.deregistered }}
      deregister_failed: ${{ steps.dereg.outputs.deregister_failed }}
    defaults:
      run:
        working-directory: .just-akash
    steps:
      # just-akash's OWN source, not the caller's — see the long note in
      # runner-pool.yml. It bites harder here: this job's whole purpose is closing a
      # lease, and a checkout that yields no `just-akash` binary fails the destroy while
      # the lease keeps holding escrow against the grant the next run spends from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'Digital-Frontier-LDA/just-akash' }}
          ref: ${{ job.workflow_sha }}
          path: .just-akash
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Close the lease
        id: close
        env:
          AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
          AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}
          DSEQ: ${{ inputs.dseq }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -uo pipefail

          # An ARRAY: the command is multiple words, so a quoted string breaks it and an
          # unquoted one is SC2086.
          JA=(uv run --with . just-akash)

          if [ -z "${DSEQ}" ]; then
            echo "closed=noop" >> "$GITHUB_OUTPUT"
            echo "no dseq supplied — the pool never took a lease, nothing to close"
            exit 0
          fi

          # DSEQ ownership is resolved inside just-akash. It positively reads the
          # deployment under the configured accounts and routes both destroy and the
          # verification read to its owner. A reordered pool cannot turn this into a
          # successful no-op; a missing owner is a hard failure.

          # OWNERSHIP — and why it is not a tag check.
          #
          # The obvious guard here is "read the deployment's tag back and refuse if it
          # does not start with TAG_PREFIX". It cannot work, and shipping it would be
          # worse than shipping nothing: just-akash's tags live in a LOCAL file
          # (api.py `_get_tag` -> `_load_tags`), never on chain, and `status --json`
          # does not emit one at all. Teardown runs as a SEPARATE JOB on a fresh
          # runner, so that lookup returns empty every single time — the guard would
          # take its "could not read the tag, proceed anyway" branch on every run while
          # reporting that ownership had been verified.
          #
          # What is actually true: DSEQ arrives from `needs.pool.outputs.dseq`, i.e.
          # from a deploy performed by THIS workflow run. That provenance is the
          # ownership proof, and it is stronger than a tag we would have written
          # ourselves anyway. TAG_PREFIX stays an input because it is what the pool
          # stamped and what a sweeper matches on — it is documentation here, not a
          # gate, and it must not be dressed up as one.
          #
          # A sweeper that reaps deployments it did not create is the thing that needs
          # an ownership check (14 third-party deployments were once destroyed that way),
          # and it cannot have one for the same reason. So the sweeper for leaked pools is
          # OPT-IN, not inference: `python -m just_akash.cleanup_stale --reap-runners`,
          # where the operator asserts the account hosts nothing but their own pools.
          echo "closing dseq=$DSEQ (created by this run; tagged ${TAG_PREFIX}-*)"

          for _try in 1 2 3; do
            "${JA[@]}" destroy --dseq "$DSEQ" -y 2>&1 | tee /tmp/destroy.log && break
            # A non-zero exit whose output says the deployment is already closed IS a
            # success. Treating it as a failure sends the next reader looking for an
            # outage that never happened.
            grep -qiE "Deployment closed|already closed|not found" /tmp/destroy.log && break
            sleep 5
          done

          # Verify rather than trust: read the state back.
          STATE=$("${JA[@]}" status --dseq "$DSEQ" --json 2>/dev/null \
                  | python3 -c "import json,sys;print((json.load(sys.stdin) or {}).get('state',''))" 2>/dev/null || true)
          # "" means we could NOT READ the state — a transient API error, a non-zero
          # exit, unparseable JSON. Reporting closed=true on that is the exact failure
          # this step exists to prevent: a success we did not achieve, with the lease
          # still holding escrow. Only a deployment the destroy said is GONE may pass on
          # an empty read.
          GONE=no
          grep -qiE "already closed|not found" /tmp/destroy.log 2>/dev/null && GONE=yes
          case "$STATE" in
            closed)
              echo "closed=true" >> "$GITHUB_OUTPUT"
              echo "lease $DSEQ confirmed closed" ;;
            "")
              if [ "$GONE" = yes ]; then
                echo "closed=true" >> "$GITHUB_OUTPUT"
                echo "lease $DSEQ no longer exists — treating as closed"
              else
                echo "closed=unknown" >> "$GITHUB_OUTPUT"
                echo "::error title=Could not VERIFY the lease is closed::dseq=$DSEQ — the destroy ran but the state read back empty, so this is 'unverified', not 'closed'. If it is still open it holds escrow against the grant the next run spends from. Check: just-akash status --dseq $DSEQ"
                exit 1
              fi ;;
            *)
              echo "closed=false" >> "$GITHUB_OUTPUT"
              echo "::error title=Lease may still be OPEN and holding escrow::dseq=$DSEQ reads state='$STATE' after 3 destroy attempts. It will keep escrow locked against the grant the next run spends from, so the next run's funding failure will look like a market outage. Close it manually: just-akash destroy --dseq $DSEQ -y"
              exit 1 ;;
          esac

      # Separate step, and always: the registration outlives the pod, so it must be
      # cleaned even when the lease close failed.
      - name: De-register offline runners for this label
        id: dereg
        if: always() && inputs.runner-label != '' && inputs.github-org != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
          ORG: ${{ inputs.github-org }}
          RUNNER_LABEL: ${{ inputs.runner-label }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no GH_RUNNER_PAT — skipping de-registration"
            echo "deregistered=0" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Scoped to THIS run's label. An org-wide "delete every offline runner" would
          # race other repos' in-flight provisioning, where a runner is briefly offline
          # between registering and coming up.
          #
          # The filter emits ONE LINE PER RUNNER and that shape is load-bearing — do not
          # "tidy" it into `[...] | .id` or any aggregating form. `gh api --paginate
          # --jq` runs the filter against EACH PAGE SEPARATELY and concatenates the
          # output, so a stream of ids stays a correct id list across pages while an
          # aggregate emits one value per page. This step is exactly where that matters:
          # de-registration is what keeps the org UNDER one page, so the first run that
          # needs it most is the one running against several.
          # A FAILED LISTING IS NOT AN EMPTY ONE — the same conflation this PR fixes in
          # the pool, and it is worse here. `|| true` turned a throttled or failing `gh`
          # into an empty IDS, and the step then published deregistered=0 and
          # deregister_failed=0: a clean sweep we never performed, for registrations we
          # never even enumerated. Silence there is what lets the listing grow.
          # `--arg`, not interpolation: the label is caller input, and splicing it into
          # the filter lets a `"` or `\` build an invalid jq program whose non-zero exit
          # this step now (correctly) reads as an unreadable listing — turning a bad
          # input into "the API is down". See the same note in runner-pool.yml.
          IDS=$(gh api --paginate "orgs/${ORG}/actions/runners?per_page=100" 2>/tmp/gh-dereg.err \
                | jq -r --arg L "$RUNNER_LABEL" \
                  '.runners[] | select(.status=="offline") | select(any(.labels[].name; .==$L)) | .id')
          GH_RC=$?
          if [ "$GH_RC" -ne 0 ]; then
            {
              echo "deregistered=unmeasured"
              echo "deregister_failed=unmeasured"
            } >> "$GITHUB_OUTPUT"
            echo "::warning title=Could not read the runner listing — de-registration did NOT run::gh rc=${GH_RC}: $(tail -1 /tmp/gh-dereg.err 2>/dev/null). Offline registrations for ${RUNNER_LABEL} are still in the org, and every pool's poll pages through them. Re-run this teardown once the API budget recovers."
            exit 0
          fi

          # A DELETE costs 5 points against GitHub's 900-points-per-minute secondary
          # limit (a GET costs 1), so a spike tearing down 100+ runners spends ~500 in
          # one burst — and several teardowns landing together will be throttled.
          #
          # Failures here are not cosmetic, they COMPOUND: a registration that survives
          # inflates the org listing, every future pool's poll pages that listing, and
          # more polling makes the next throttle likelier. The listing is also what
          # overflowed a page and broke provisioning for every repo in the org. So a
          # throttled burst must be counted and reported, not left as N per-runner
          # warnings nobody totals.
          N=0
          FAILED=0
          for id in $IDS; do
            if gh api -X DELETE "orgs/${ORG}/actions/runners/${id}" >/dev/null 2>&1; then
              N=$((N+1))
            else
              FAILED=$((FAILED+1))
            fi
          done
          echo "deregistered=$N" >> "$GITHUB_OUTPUT"
          echo "deregister_failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "de-registered ${N} offline runner(s) labelled ${RUNNER_LABEL}"
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning title=${FAILED} runner registration(s) left behind::They stay in the org listing, which every pool's poll pages through — so this raises the request cost of the NEXT run and makes the next throttle likelier. Usual cause at spike is the 900-points/minute secondary limit (a DELETE costs 5). Re-run this teardown, or sweep offline runners for label ${RUNNER_LABEL}."
          fi

# Close an ephemeral runner lease, and de-register what it left behind.
#
#   jobs:
#     teardown:
#       needs: [pool, work]
#       if: always() && needs.pool.outputs.dseq != ''
#       uses: Digital-Frontier-LDA/just-akash/.github/workflows/runner-teardown.yml@runner-v1
#       with:
#         dseq:           ${{ needs.pool.outputs.dseq }}
#         tag-prefix:     ci-myrepo
#         runner-label:   fast-pool-${{ github.run_id }}
#         github-org:     my-org
#         wallet-address: ${{ needs.pool.outputs.wallet_address }}   # create-time owner candidate
#         deployment-group: ${{ needs.pool.outputs.deployment_group }} # final group_spec.name
#       secrets:
#         AKASH_API_KEY:  ${{ secrets.AKASH_API_KEY }}
#         AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}              # only with a pool
#         GH_RUNNER_PAT:  ${{ secrets.GH_RUNNER_PAT }}
#
# `if: always()` is the whole point — a teardown that only runs on success leaves the
# lease open on exactly the runs that failed, which are the ones most likely to have
# left a broken pod burning escrow.
#
# ── TWO THINGS LEAK, NOT ONE ────────────────────────────────────────────────────
# 1. The LEASE holds escrow against the same grant the next run spends from, so a leak
#    makes the next run's funding failure look like a market outage.
# 2. The RUNNER REGISTRATION persists in the org even after the pod dies. Offline
#    registrations once overflowed the first page of the org's runner listing and broke
#    provisioning for every repo in the org. EPHEMERAL=true removes a runner that RAN a
#    job; it does nothing for one that registered and was never used.
#
# ── WHY IT VERIFIES INSTEAD OF TRUSTING THE EXIT CODE ───────────────────────────
# Neither destroy text nor its exit code proves closure. Two distinct chain hosts
# must agree on the complete owner-scoped lease population, with every lease terminal,
# and positively read both deployment and escrow closed.
# Unreadable, empty, partial, active, or disagreeing populations remain unverified.
name: Akash runner teardown

on:
  workflow_call:
    inputs:
      just-akash-ref:
        description: >-
          REQUIRED, no default. The just-akash revision to close the lease WITH.
          Pass the same ref you pinned this workflow to.

          NO DEFAULT ON PURPOSE — see runner-pool.yml's input of the same name. It
          bites harder here: a checkout that yields no `just-akash` binary fails the
          destroy, and the lease keeps holding escrow against the grant the next run
          spends from (#184).
        required: true
        type: string
      just-akash-repository:
        description: >-
          Repository to take the just-akash CLI from. Defaults to this repo; override
          it so a fork's callers close leases with the FORK's CLI.
        required: false
        default: 'Digital-Frontier-LDA/just-akash'
        type: string
      dseq:
        description: >-
          Deployment to close. Empty is a no-op only with an authoritative
          no-deployment outcome; an unknown create outcome is HELD.
        required: false
        type: string
        default: ''
      deployment-outcome:
        description: >-
          Create-side effect classification. Pass unknown when a create request may have
          committed without returning an identity; teardown then fails HELD instead of
          reporting a clean no-op. Defaults to no-deployment for legacy explicit no-op calls.
        required: false
        type: string
        default: 'no-deployment'
      create-ambiguous:
        description: >-
          'true' when a later create may have committed without returning an identity.
          The known dseq is still closed and proven, then the job fails HELD with
          CREATE_OUTCOME_AMBIGUOUS, because a second deployment may exist.
        required: false
        type: string
        default: ''
      tag-prefix:
        description: >-
          REQUIRED. Asserted against the deployment's own tag before anything is
          destroyed. A sweep once destroyed 14 third-party deployments; this is the
          check that makes a wrong dseq a refusal instead of a loss.
        required: true
        type: string
      runner-label:
        description: 'Label whose offline registrations should be de-registered.'
        required: false
        type: string
        default: ''
      runner-ids:
        description: >-
          JSON array of exact runner IDs created by the pool. When present, teardown
          removes these identities regardless of transient status; an empty array uses
          the operation-label fallback and holds online or busy runners.
        required: false
        type: string
        default: '[]'
      github-org:
        required: false
        type: string
        default: ''
      wallet-address:
        description: >-
          Create-time owner candidate emitted by runner-pool. When present, teardown
          requires both a configured Console credential that reports this exact owner
          and a complete exact owner/DSEQ chain read before destroying. Empty preserves
          the legacy Console deployment-read path for older callers.
        required: false
        type: string
        default: ''
      deployment-group:
        description: >-
          Final submitted group_spec.name emitted by runner-pool. When present, teardown
          accepts the owner/DSEQ chain identity only when its complete group population is
          exactly this singleton. Valid only with wallet-address. Empty preserves the legacy
          owner-bound check for older callers.
        required: false
        type: string
        default: ''
    secrets:
      AKASH_API_KEY:
        required: false
      AKASH_API_KEYS:
        required: false
        description: >-
          Console wallet pool. just-akash probes the DSEQ under each distinct key and
          destroys only through the account that positively reads ownership. Key order
          no longer has lifecycle meaning.
      GH_RUNNER_PAT:
        required: false
    outputs:
      closed:
        description: "'true' only when the lease was READ BACK as closed."
        value: ${{ jobs.teardown.outputs.closed }}
      held_reason:
        description: >-
          Non-empty when the close was HELD without closure authority, so the lease may
          still be live and holding escrow. OWNER_UNKNOWN: the pool published a DSEQ
          and group with no create-time owner, and no exhaustive owner registry exists
          to recover one. The job fails; held_dseq and held_deployment_group locate it.
        value: ${{ jobs.teardown.outputs.held_reason }}
      held_dseq:
        description: 'The exact DSEQ of a HELD lease; empty unless held_reason is set.'
        value: ${{ jobs.teardown.outputs.held_dseq }}
      held_deployment_group:
        description: 'The expected group of a HELD lease; empty unless held_reason is set.'
        value: ${{ jobs.teardown.outputs.held_deployment_group }}
      deregistered:
        description: 'Offline runner registrations removed.'
        value: ${{ jobs.teardown.outputs.deregistered }}
      deregister_failed:
        description: >-
          Registrations that could NOT be removed, or `unmeasured` when the listing
          itself was unreadable — which is NOT the same as zero, and must never be
          reported as a clean sweep.

          Non-zero is a compounding leak rather than a cosmetic one: each survivor
          stays in the org listing that every pool's poll pages through, so it raises
          the request cost of every later run and makes the next throttle likelier.
        value: ${{ jobs.teardown.outputs.deregister_failed }}

permissions:
  contents: read

jobs:
  teardown:
    name: Close lease and de-register runners
    runs-on: ubuntu-latest
    # ⛔ MUST EXCEED the owner-lookup deadline + close/audit margin (see
    # just_akash/owner_lookup.py: 10 + 4 = 14 min at the time of writing), pinned by
    # tests/test_owner_lookup_deadline.py. A job killed mid-cleanup by its own
    # timeout is the failure #370 exists to prevent.
    timeout-minutes: 30
    outputs:
      closed: ${{ steps.close.outputs.closed }}
      held_reason: ${{ steps.close.outputs.held_reason }}
      held_dseq: ${{ steps.close.outputs.held_dseq }}
      held_deployment_group: ${{ steps.close.outputs.held_deployment_group }}
      deregistered: ${{ steps.dereg.outputs.deregistered }}
      deregister_failed: ${{ steps.dereg.outputs.deregister_failed }}
    defaults:
      run:
        working-directory: .just-akash
    steps:
      # just-akash's OWN source, not the caller's — see the long note in
      # runner-pool.yml. It bites harder here: this job's whole purpose is closing a
      # lease, and a checkout that yields no `just-akash` binary fails the destroy while
      # the lease keeps holding escrow against the grant the next run spends from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.just-akash-repository }}
          ref: ${{ inputs.just-akash-ref }}
          path: .just-akash
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Close the lease
        id: close
        env:
          AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
          AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}
          DSEQ: ${{ inputs.dseq }}
          WALLET_ADDRESS: ${{ inputs.wallet-address }}
          DEPLOYMENT_GROUP: ${{ inputs.deployment-group }}
          DEPLOYMENT_OUTCOME: ${{ inputs.deployment-outcome }}
          CREATE_AMBIGUOUS: ${{ inputs.create-ambiguous }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -uo pipefail

          # An ARRAY: the command is multiple words, so a quoted string breaks it and an
          # unquoted one is SC2086.
          JA=(uv run --with . just-akash)
          # ⛔ ONE lookup budget for the WHOLE STEP (#378): every resolve-owner/destroy in
          # this step — including each retry — shares this absolute ceiling (epoch
          # seconds); just-akash honours it as min(own budget, ceiling).
          export OWNER_LOOKUP_DEADLINE_AT=$(( $(date +%s) + 600 ))


          if [ -z "${DSEQ}" ] && { [ "${DEPLOYMENT_OUTCOME:-unknown}" != "no-deployment" ] || [ "${CREATE_AMBIGUOUS:-}" = "true" ]; }; then
            HELD_GROUP=""
            [[ "${DEPLOYMENT_GROUP:-}" =~ ^[A-Za-z0-9._-]+$ ]] && HELD_GROUP="$DEPLOYMENT_GROUP"
            {
              echo "closed=unknown"
              echo "held_reason=CREATE_OUTCOME_AMBIGUOUS"
              echo "held_dseq="
              echo "held_deployment_group=$HELD_GROUP"
            } >> "$GITHUB_OUTPUT"
            echo "::error title=HELD: create outcome ambiguous, no teardown identity::The create request may have committed but returned no DSEQ. Nothing can be closed automatically; reconcile the create receipt or owner-scoped chain population before another create. group=${HELD_GROUP:-<unknown>}"
            exit 1
          fi

          if [ -z "${DSEQ}" ]; then
            echo "closed=noop" >> "$GITHUB_OUTPUT"
            echo "no dseq supplied — the pool never took a lease, nothing to close"
            exit 0
          fi

          # DSEQ is a workflow input and is later interpolated into GitHub
          # workflow-command annotations. Accept only the canonical decimal
          # representation so control characters cannot inject a command.
          if [[ ! "${DSEQ}" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid DSEQ::dseq must contain digits only"
            echo "closed=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # DSEQ ownership is resolved inside just-akash. It positively reads the
          # deployment under the configured accounts and routes both destroy and the
          # verification read to its owner. A reordered pool cannot turn this into a
          # successful no-op; a missing owner is a hard failure.

          # OWNERSHIP — and why it is not a tag check.
          #
          # The obvious guard here is "read the deployment's tag back and refuse if it
          # does not start with TAG_PREFIX". It cannot work, and shipping it would be
          # worse than shipping nothing: just-akash's tags live in a LOCAL file
          # (api.py `_get_tag` -> `_load_tags`), never on chain, and `status --json`
          # does not emit one at all. Teardown runs as a SEPARATE JOB on a fresh
          # runner, so that lookup returns empty every single time — the guard would
          # take its "could not read the tag, proceed anyway" branch on every run while
          # reporting that ownership had been verified.
          #
          # What is actually true: DSEQ arrives from `needs.pool.outputs.dseq`, i.e.
          # from a deploy performed by THIS workflow run. That provenance is the
          # ownership proof, and it is stronger than a tag we would have written
          # ourselves anyway. TAG_PREFIX stays an input because it is what the pool
          # stamped and what a sweeper matches on — it is documentation here, not a
          # gate, and it must not be dressed up as one.
          #
          # A sweeper that reaps deployments it did not create is the thing that needs
          # an ownership check (14 third-party deployments were once destroyed that way),
          # and it cannot have one for the same reason. So the sweeper for leaked pools is
          # OPT-IN, not inference: `python -m just_akash.cleanup_stale --reap-runners`,
          # where the operator asserts the account hosts nothing but their own pools.
          # ⛔ AN OWNER-LESS RECEIPT IS HELD, NEVER RESOLVED BY PROBING (#348). The
          # destructive identity is the pair (owner, dseq); a DSEQ alone is not globally
          # queryable and can collide across owners. Recovering the owner needs the
          # complete registered owner population read through each independent chain
          # observer with exactly one agreeing match (df-wiki ownership standard), and
          # just-akash has no such registry. Trying configured accounts until one reads
          # the DSEQ is forbidden: it can select a foreign owner. resolve-owner also
          # refuses --expected-group without --expected-owner. So: no resolve, no
          # destroy, a FAILED job, and outputs that locate the still-live lease.
          if [ -z "${WALLET_ADDRESS:-}" ]; then
            # The group is echoed into GITHUB_OUTPUT and an annotation, so only the
            # canonical group-name shape is published (DSEQ is digits-only above).
            HELD_GROUP=""
            [[ "$DEPLOYMENT_GROUP" =~ ^[A-Za-z0-9._-]+$ ]] && HELD_GROUP="$DEPLOYMENT_GROUP"
            {
              echo "closed=unknown"
              echo "held_reason=OWNER_UNKNOWN"
              echo "held_dseq=$DSEQ"
              echo "held_deployment_group=$HELD_GROUP"
            } >> "$GITHUB_OUTPUT"
            echo "::error title=HELD: lease owner unknown, no closure authority::dseq=$DSEQ group=${HELD_GROUP:-<non-canonical>} was published without its create-time owner. Nothing was resolved or closed; the lease may still be live and holding escrow. Recover the owner from the exhaustive owner registry (just-akash#351) or an operator, then close the exact (owner, dseq)."
            exit 1
          fi

          echo "closing dseq=$DSEQ (created by this run; tagged ${TAG_PREFIX}-*)"

          # ⛔ RESOLVE OWNER BEFORE DESTROY. After destroy the Console API may
          # 404 — the deployment is gone, the wallet pool read returns empty,
          # and a verify-closed call that depends on resolving the owner at
          # verify-time will fail precisely when it matters. Capture the
          # positively-owning account now while the deployment still reads.
          # ⛔ bash `-e` is the DEFAULT (set -uo pipefail does not disable it);
          # an unguarded non-zero exit from resolve-owner would terminate the
          # script BEFORE OWNER_RC is captured and BEFORE closed=unknown is
          # written — the harness reproduces this as empty GITHUB_OUTPUT.
          # `|| OWNER_RC=$?` makes the failure non-fatal so we can branch on
          # it below. Same pattern applies to verify-closed below.
          RESOLVE_ARGS=(--dseq "$DSEQ" --json)
          if [ -n "${WALLET_ADDRESS:-}" ]; then
            RESOLVE_ARGS+=(--expected-owner "$WALLET_ADDRESS")
          fi
          if [ -n "${DEPLOYMENT_GROUP:-}" ]; then
            RESOLVE_ARGS+=(--expected-group "$DEPLOYMENT_GROUP")
          fi
          # ⛔ UNREACHABLE WAS A HARD ONE-SHOT FAILURE (#404). When a single
          # chain source returned [] or timed out, wallet_pool surfaced an
          # OWNER_LOOKUP_UNREACHABLE verdict and the CLI exited 75; the step
          # captured OWNER_RC=75 and exited 1 — leaving the lease ACTIVE and
          # not retrying. With chain.py now retrying within a per-call Deadline
          # AND each call failing fast for transient transport errors, an exit
          # 75 here means the source is durably down for THIS run and a fresh
          # attempt with backoff is the right move (it costs ~5–60 s of wall
          # clock, well inside the step's 1 h default and the 10 m budget the
          # destroy loop sets below). The retry budget is bounded so a real
          # outage still aborts the step with the same ::error surface as
          # before — only with one more attempt's worth of evidence in the
          # log.
          OWNER_RC=0
          RESOLVE_TRIES=0
          RESOLVE_TRIES_MAX=3
          RESOLVE_BACKOFFS=(1 4 16)
          while [ "$RESOLVE_TRIES" -lt "$RESOLVE_TRIES_MAX" ]; do
            RESOLVE_TRIES=$((RESOLVE_TRIES + 1))
            # ⛔ RESET OWNER_RC INSIDE THE LOOP (#404 review). `|| OWNER_RC=$?`
            # only fires when the command FAILS. On a successful attempt the
            # ``||`` is skipped and OWNER_RC keeps its previous value (often 75
            # from an earlier transient outage), so `[ "$OWNER_RC" -eq 0 ]` is
            # `[ 75 -eq 0 ]`, never true, and the loop burns every try of the
            # budget on what was actually a transient-then-recovers case.
            OWNER_RC=0
            : >/tmp/owner.json
            : >/tmp/owner.err
            "${JA[@]}" resolve-owner "${RESOLVE_ARGS[@]}" >/tmp/owner.json 2>/tmp/owner.err || OWNER_RC=$?
            # Exit 0 → resolve-owner succeeded; we have the JSON we need.
            [ "$OWNER_RC" -eq 0 ] && break
            # Exit 75 (OWNER_LOOKUP_UNREACHABLE) → retry unless we've burned
            # the budget. Stderr on the final attempt is preserved verbatim
            # below for the ::error annotation.
            if [ "$OWNER_RC" -eq 75 ] && [ "$RESOLVE_TRIES" -lt "$RESOLVE_TRIES_MAX" ]; then
              backoff="${RESOLVE_BACKOFFS[$((RESOLVE_TRIES - 1))]}"
              echo "::warning title=resolve-owner unreachable, retrying::dseq=$DSEQ — attempt ${RESOLVE_TRIES}/${RESOLVE_TRIES_MAX} returned exit 75 (OWNER_LOOKUP_UNREACHABLE); sleeping ${backoff}s before the next try. stderr: $(tr '\n' ' ' </tmp/owner.err | cut -c1-300)"
              sleep "$backoff"
              continue
            fi
            # Any other exit code (1, real disagreement / wrong group /
            # unknown). Step-time fail-fast — the loop below logs the rc and
            # exits 1 unchanged.
            break
          done
          # ⛔ THE STDERR IS THE WHOLE DIAGNOSIS, AND IT USED TO BE THROWN AWAY.
          # resolve-owner's stderr was captured to /tmp/owner.err on the line
          # above and then read by NOTHING — the two failure branches below
          # reported only the exit code. Six teardown failures across
          # Borduas-Holdings/blazing on 2026-09-10 said exactly
          # "resolve-owner exited 1" and nothing else, so whether the cause was
          # a resolver bug, a wallet_pool multi-key case or an endpoint outage
          # could not be told from any log — diagnosing it meant re-deriving by
          # hand what this step had already been told.
          #
          # ⇒ An error that says a thing could not be done, while discarding the
          # reason it could not, costs every future reader the same
          # investigation. One line into the annotation, the full text into the
          # step log.
          #
          # ⚠ Newlines are folded and the annotation excerpt is capped: `::error`
          # is a SINGLE-LINE protocol, and a multi-line value silently truncates
          # at the first newline — which would drop exactly the detail this adds.
          OWNER_ERR=""
          if [ -s /tmp/owner.err ]; then
            OWNER_ERR=$(tr '\n' ' ' < /tmp/owner.err | cut -c1-400)
          fi
          if [ "$OWNER_RC" -ne 0 ]; then
            echo "::error title=Could not resolve owner before destroy::dseq=$DSEQ — resolve-owner exited $OWNER_RC. Without a captured owner, closure verification cannot proceed safely after destroy. stderr: ${OWNER_ERR:-<empty>}"
            echo "--- resolve-owner stderr (dseq=$DSEQ) ---" >&2
            sed -e 's/^/    /' /tmp/owner.err >&2 || true
            echo "closed=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          OWNER=$(python3 -c "import json,sys;print(json.load(sys.stdin).get('owner',''))" \
                  </tmp/owner.json 2>/dev/null || echo "")
          if [ -z "$OWNER" ]; then
            # ⚠ EXIT 0 WITH NO OWNER IS THE QUIETER HALF OF THE SAME FAULT: the
            # resolver succeeded and returned nothing usable, so there is no exit
            # code to report and the stderr is the only evidence there is.
            echo "::error title=No owner captured::dseq=$DSEQ — resolve-owner exited 0 but returned an empty owner. stderr: ${OWNER_ERR:-<empty>}"
            echo "--- resolve-owner stderr (dseq=$DSEQ) ---" >&2
            sed -e 's/^/    /' /tmp/owner.err >&2 || true
            echo "closed=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "captured owner=$OWNER"

          DESTROY_ARGS=(--dseq "$DSEQ" -y)
          if [ -n "${WALLET_ADDRESS:-}" ]; then
            DESTROY_ARGS+=(--expected-owner "$OWNER")
          fi
          if [ -n "${DEPLOYMENT_GROUP:-}" ]; then
            DESTROY_ARGS+=(--expected-group "$DEPLOYMENT_GROUP")
          fi

          # ⛔ THE RETRY BUDGET WAS ON THE WRONG OPERATION. This loop retries the
          # DESTROY three times; the verification below used to get exactly one
          # immediate read. On blazing#920 (run 34138613280) destroy SUCCEEDED on
          # attempt 1 — it printed "Deployment 1788795018717 destroyed." — and the
          # read ~4s later still returned 'active', so the step failed with "Lease
          # may still be OPEN and holding escrow". The lease was closed: the stale
          # sweep 26 minutes later enumerated every live deployment and that dseq was
          # not among them. The close was accepted and had not yet propagated. It is
          # the OBSERVATION that needed patience, not the action.
          DESTROY_TRIES=0
          # ⛔ FRESH ceiling for THIS close window (#378 repair): resolve-owner above
          # spent wall time against the step-start ceiling; the destroy retries get
          # their own, so the window never inherits a stale one.
          export OWNER_LOOKUP_DEADLINE_AT=$(( $(date +%s) + 600 ))
          for _try in 1 2 3; do
            DESTROY_TRIES=$_try
            DESTROY_RC=0
            "${JA[@]}" destroy "${DESTROY_ARGS[@]}" 2>&1 | tee /tmp/destroy.log || DESTROY_RC=${PIPESTATUS[0]}
            # ⛔ 75 = OWNER_LOOKUP_UNREACHABLE (owner_lookup.OWNER_LOOKUP_UNREACHABLE_EXIT_CODE):
            # the step's shared lookup budget is exhausted — retrying re-spends a dead budget.
            [ "$DESTROY_RC" -eq 75 ] && break
            [ "$DESTROY_RC" -eq 0 ] && break
            # A non-zero exit whose output says the deployment is already closed IS a
            # success. Treating it as a failure sends the next reader looking for an
            # outage that never happened.
            # ⛔ Match just-akash's CONTRACT strings only — "Deployment closed" and
            # "already closed". "not found" is a generic substring that false-greens on
            # any error message containing those words ("credentials file not found",
            # missing config file, etc.) and would exit this loop on a destroy that
            # never actually closed the lease.
            grep -qiE "Deployment closed|already closed" /tmp/destroy.log && break
            sleep 5
          done

          # ⛔ CLOSURE PROOF MUST COME FROM TWO-ENDPOINT CHAIN AGREEMENT, NOT FROM
          # THIS STEP'S OWN OBSERVATIONS. A single Console API read, a destroy text
          # match, or a partial read can all read as success over an OPEN lease (the
          # exact failure #952 reproduced 2026-09-09: Console GET 404 with the chain
          # still showing state=active). The verify-closed subcommand paginates the
          # owner/dseq intersection from two distinct HTTPS chain origins and only
          # returns closed=true when BOTH return the SAME complete identity map and
          # every entry's state is terminal. The owner is the one captured by
          # resolve-owner BEFORE destroy, so a Console 404 at verify-time does not
          # blind the verifier.
          # ⛔ `|| VERIFY_RC=$?` so a verify-closed exit 1 does not abort the
          # script under bash `-e` (set -uo pipefail does not disable -e).
          # Without this, a non-zero exit skips VERIFY_RC capture and the
          # closed=unknown branch below — reproducing the empty-GITHUB_OUTPUT
          # failure mode the harness exercises.
          "${JA[@]}" verify-closed --dseq "$DSEQ" --owner "$OWNER" --json \
            >/tmp/verify.json 2>/tmp/verify.err || VERIFY_RC=$?
          VERIFY_RC=${VERIFY_RC:-0}
          # ⛔ Typed check: only Python's literal True counts as "closed". The
          # JSON `closed: true` is a Python True; the JSON `closed: false` is
          # a Python False; anything else (None, missing, string) is unknown.
          # Using `is True` here — and echoing `True`/`False` to bash — means
          # a future JSON shape like `closed: "True"` (string) cannot pass.
          VERDICT=$(python3 -c "import json,sys;print(json.load(sys.stdin).get('closed') is True)" \
                    </tmp/verify.json 2>/dev/null || echo "False")
          REASON=$(python3 -c "import json,sys;print(json.load(sys.stdin).get('reason',''))" \
                   </tmp/verify.json 2>/dev/null || echo "")
          echo "verify: destroy attempts=$DESTROY_TRIES, chain verdict=$VERDICT reason=$REASON"
          # ⛔ BOTH the typed closed=True AND a zero exit are required. stdout True
          # alone must not override a non-zero exit.
          if [ "$VERIFY_RC" -eq 0 ] && [ "$VERDICT" = "True" ]; then
            echo "closed=true" >> "$GITHUB_OUTPUT"
            echo "lease $DSEQ closed; verifier returned terminal states across two endpoints"
            # ⛔ THE KNOWN LEASE IS CLOSED, BUT A LATER CREATE MAY HAVE LANDED (#348).
            # Closing the last known dseq cannot prove there is no second deployment, so
            # an ambiguous create still fails HELD rather than reporting a clean close.
            if [ "${CREATE_AMBIGUOUS:-}" = "true" ]; then
              HELD_GROUP=""
              [[ "${DEPLOYMENT_GROUP:-}" =~ ^[A-Za-z0-9._-]+$ ]] && HELD_GROUP="$DEPLOYMENT_GROUP"
              {
                echo "held_reason=CREATE_OUTCOME_AMBIGUOUS"
                echo "held_dseq="
                echo "held_deployment_group=$HELD_GROUP"
              } >> "$GITHUB_OUTPUT"
              echo "::error title=HELD: a later create outcome is ambiguous::Known lease $DSEQ is closed and proven, but a later create may have committed without returning a DSEQ. Reconcile the create receipt or the owner-scoped chain population before another create. group=${HELD_GROUP:-<unknown>}"
              exit 1
            fi
            exit 0
          fi
          echo "closed=unknown" >> "$GITHUB_OUTPUT"
          echo "::error title=Could not VERIFY the lease is closed::dseq=$DSEQ verifier said '$REASON' (rc=$VERIFY_RC). The destroy ran but the chain did not agree on a terminal state across two endpoints. If it is still open it holds escrow against the grant the next run spends from. Check: just-akash verify-closed --dseq $DSEQ --owner $OWNER"
          exit 1

      # Separate step, and always: the registration outlives the pod, so it must be
      # cleaned even when the lease close failed.
      - name: De-register offline runners for this label
        id: dereg
        if: always() && inputs.runner-label != '' && inputs.github-org != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
          ORG: ${{ inputs.github-org }}
          RUNNER_LABEL: ${{ inputs.runner-label }}
          RUNNER_IDS_JSON: ${{ inputs.runner-ids }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no GH_RUNNER_PAT — skipping de-registration"
            echo "deregistered=0" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Scoped to THIS run's label. An org-wide "delete every offline runner" would
          # race other repos' in-flight provisioning, where a runner is briefly offline
          # between registering and coming up.
          #
          # The filter emits ONE LINE PER RUNNER and that shape is load-bearing — do not
          # "tidy" it into `[...] | .id` or any aggregating form. `gh api --paginate
          # --jq` runs the filter against EACH PAGE SEPARATELY and concatenates the
          # output, so a stream of ids stays a correct id list across pages while an
          # aggregate emits one value per page. This step is exactly where that matters:
          # de-registration is what keeps the org UNDER one page, so the first run that
          # needs it most is the one running against several.
          # A FAILED LISTING IS NOT AN EMPTY ONE — the same conflation this PR fixes in
          # the pool, and it is worse here. `|| true` turned a throttled or failing `gh`
          # into an empty IDS, and the step then published deregistered=0 and
          # deregister_failed=0: a clean sweep we never performed, for registrations we
          # never even enumerated. Silence there is what lets the listing grow.
          # `--arg`, not interpolation: the label is caller input, and splicing it into
          # the filter lets a `"` or `\` build an invalid jq program whose non-zero exit
          # this step now (correctly) reads as an unreadable listing — turning a bad
          # input into "the API is down". See the same note in runner-pool.yml.
          if [ -n "${RUNNER_IDS_JSON:-}" ] && [ "$RUNNER_IDS_JSON" != "[]" ]; then
            IDS_RC=0
            IDS=$(printf '%s' "$RUNNER_IDS_JSON" | jq -er \
              'if type=="array" and length>0 and all(.[]; type=="number" and .>0 and floor==.) and (unique|length)==length then .[] else error("invalid exact runner ids") end') || IDS_RC=$?
            VERIFIED_IDS=''
            if [ "$IDS_RC" -eq 0 ]; then
              for id in $IDS; do
                RUNNER_RC=0
                RUNNER=$(gh api "orgs/${ORG}/actions/runners/${id}" 2>/tmp/gh-dereg.err) || RUNNER_RC=$?
                if [ "$RUNNER_RC" -ne 0 ] || ! printf '%s' "$RUNNER" | jq -e \
                    --argjson ID "$id" --arg L "$RUNNER_LABEL" \
                    '.id==$ID and (.name|type=="string" and startswith("just-akash-")) and any(.labels[].name; .==$L) and any(.labels[].name; .=="self-hosted") and any(.labels[].name; .=="akash")' >/dev/null; then
                  IDS_RC=1
                  break
                fi
                VERIFIED_IDS="${VERIFIED_IDS}${id}\n"
              done
            fi
            if [ "$IDS_RC" -ne 0 ]; then
              {
                echo "deregistered=0"
                echo "deregister_failed=unmeasured"
              } >> "$GITHUB_OUTPUT"
              echo "::warning title=Exact runner identity could not be bound — de-registration did NOT run::Every requested ID must read back with the exact operation label plus self-hosted and akash labels. No runner was deleted. $(tail -1 /tmp/gh-dereg.err 2>/dev/null)"
              exit 0
            fi
            IDS=$(printf '%b' "$VERIFIED_IDS")
          else
            IDS=$(gh api --paginate "orgs/${ORG}/actions/runners?per_page=100" 2>/tmp/gh-dereg.err \
                  | jq -r --arg L "$RUNNER_LABEL" \
                    '.runners[] | select(.status=="offline") | select(.busy==false) | select(any(.labels[].name; .==$L)) | .id')
            GH_RC=$?
            if [ "$GH_RC" -ne 0 ]; then
              {
                echo "deregistered=unmeasured"
                echo "deregister_failed=unmeasured"
              } >> "$GITHUB_OUTPUT"
              echo "::warning title=Could not read the runner listing — de-registration did NOT run::gh rc=${GH_RC}: $(tail -1 /tmp/gh-dereg.err 2>/dev/null). Offline registrations for ${RUNNER_LABEL} are still in the org, and every pool's poll pages through them. Re-run this teardown once the API budget recovers."
              exit 0
            fi
          fi

          # A DELETE costs 5 points against GitHub's 900-points-per-minute secondary
          # limit (a GET costs 1), so a spike tearing down 100+ runners spends ~500 in
          # one burst — and several teardowns landing together will be throttled.
          #
          # Failures here are not cosmetic, they COMPOUND: a registration that survives
          # inflates the org listing, every future pool's poll pages that listing, and
          # more polling makes the next throttle likelier. The listing is also what
          # overflowed a page and broke provisioning for every repo in the org. So a
          # throttled burst must be counted and reported, not left as N per-runner
          # warnings nobody totals.
          N=0
          FAILED=0
          for id in $IDS; do
            if gh api -X DELETE "orgs/${ORG}/actions/runners/${id}" >/dev/null 2>&1; then
              N=$((N+1))
            else
              FAILED=$((FAILED+1))
            fi
          done
          echo "deregistered=$N" >> "$GITHUB_OUTPUT"
          echo "deregister_failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "de-registered ${N} offline runner(s) labelled ${RUNNER_LABEL}"
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning title=${FAILED} runner registration(s) left behind::They stay in the org listing, which every pool's poll pages through — so this raises the request cost of the NEXT run and makes the next throttle likelier. Usual cause at spike is the 900-points/minute secondary limit (a DELETE costs 5). Re-run this teardown, or sweep offline runners for label ${RUNNER_LABEL}."
          fi

name: Load SOPS secrets
description: >-
  Decrypt secrets/ci.sops.env with the repo's age key and export every variable
  into $GITHUB_ENV, so jobs read one bootstrap secret (SOPS_AGE_KEY) instead of
  a growing list of individual GitHub secrets.

inputs:
  age-key:
    description: The ci-just-akash age private key (pass secrets.SOPS_AGE_KEY).
    required: true
  file:
    description: Path to the SOPS-encrypted env file.
    required: false
    default: secrets/ci.sops.env

runs:
  using: composite
  steps:
    - name: Install sops
      shell: bash
      run: |
        set -euo pipefail
        # Always this exact, checksum-verified binary: it receives the age key. No
        # "already on PATH" shortcut, which would trust whatever sops the image carries.
        # Same pin as runner-pool.yml's own SOPS steps.
        VERSION=3.13.1
        SHA256=620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a
        DL=$(mktemp -d)
        trap 'rm -rf "$DL"' EXIT
        curl -sSfL -o "$DL/sops" \
          "https://github.com/getsops/sops/releases/download/v${VERSION}/sops-v${VERSION}.linux.amd64"
        echo "${SHA256}  $DL/sops" | sha256sum --check --quiet
        sudo install -m 0755 "$DL/sops" /usr/local/bin/sops
        sops --version

    - name: Decrypt and export
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.age-key }}
        SOPS_FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        if [ -z "${SOPS_AGE_KEY:-}" ]; then
          echo "::error::SOPS_AGE_KEY is empty — cannot decrypt ${SOPS_FILE}"
          exit 1
        fi
        # Decrypt to a private tmpfile, never to stdout: a decrypted value echoed
        # into the log would defeat the whole point of encrypting it at rest.
        # JSON, not dotenv: sops' dotenv output escapes a newline as a literal
        # backslash-n, so a multi-line value (a newline-separated AKASH_API_KEYS
        # wallet list) would reach its reader as ONE broken value.
        umask 077
        WORK=$(mktemp -d)
        trap 'rm -rf "$WORK"' EXIT
        sops --decrypt --input-type dotenv --output-type json "$SOPS_FILE" > "$WORK/plain.json"
        # Into a file, not `< <(jq ...)`: set -e does not see a process substitution fail.
        jq -r 'keys_unsorted[]' "$WORK/plain.json" > "$WORK/keys"
        loaded=0
        while IFS= read -r key; do
          jq -j --arg k "$key" '.[$k]' "$WORK/plain.json" > "$WORK/value"
          # Mask every line BEFORE exporting, so any later accidental echo is redacted
          # by the runner. One ::add-mask:: per line: a multi-line value in a single
          # command would print its second line. A wallet list is also masked per key,
          # because a log line may print one key alone.
          if [ "$key" = AKASH_API_KEYS ]; then
            tr ',;' '\n\n' < "$WORK/value"
          else
            cat "$WORK/value"
          fi | while IFS= read -r piece || [ -n "$piece" ]; do
            piece="${piece#"${piece%%[![:space:]]*}"}"
            piece="${piece%"${piece##*[![:space:]]}"}"
            [ -z "$piece" ] || echo "::add-mask::$piece"
          done
          delim="SOPS_EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          { printf '%s<<%s\n' "$key" "$delim"; cat "$WORK/value"; printf '\n%s\n' "$delim"; } >> "$GITHUB_ENV"
          loaded=$((loaded + 1))
        done < "$WORK/keys"
        echo "Loaded ${loaded} secret(s) from ${SOPS_FILE}"
